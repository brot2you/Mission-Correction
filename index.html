Irréguliers : que je sois, que j'aie, que je fasse, que j'aille, que je puisse, que je sache.", "tool": "remplacer", "toolUse": "Remplace le verbe par « faire » : « Il faut que tu fasses » (subjonctif) / « Je sais que tu fais » (indicatif) — la différence s'entend.", "ex": "Je veux que tu saches la vérité avant qu'il soit trop tard.", "piege": "« Après que » est suivi de l'indicatif (fait réalisé) : « après qu'il est parti ».", "note": null, "defis": [{"q": "Il faut que vous ___ prudents.", "a": "soyez", "w": ["êtes", "soyiez"], "why": "Il faut que + subjonctif : que vous soyez."}, {"q": "Je pense qu'il ___ raison.", "a": "a", "w": ["ait"], "why": "Penser que (à la forme affirmative) : indicatif."}, {"q": "Bien qu'elle ___ peur, elle avance.", "a": "ait", "w": ["a", "est"], "why": "Bien que + subjonctif."}, {"q": "Je souhaite que tu ___ le code. (trouver)", "a": "trouves", "w": ["trouveras", "trouvais"], "why": "Souhait : subjonctif."}, {"q": "Pour que nous ___ entrer, il faut la clé. (pouvoir)", "a": "puissions", "w": ["pouvons", "pourrions"], "why": "Pour que + subjonctif."}, {"q": "Il est sûr que le suspect ___ menti.", "a": "a", "w": ["ait"], "why": "Certitude : indicatif."}], "terrain": [{"t": "Il faut que tu {viens|viennes} avec nous.", "why": "« Il faut que » + subjonctif : « que tu viennes »."}, {"t": "Je veux qu'il {fait|fasse} attention.", "why": "Volonté + subjonctif : « qu'il fasse »."}], "open": false}, {"num": 22, "id": "IMPER", "fam": "CONJ", "title": "L'impératif", "lv": [5, 4], "affaire": "L'affaire des ordres secrets", "q": "« Range ! » sans s mais « Finis ! » avec un s : pourquoi ?", "groups": ["sans -s", "avec -s"], "corpus": [{"t": "[Range] ta chambre !", "g": 0}, {"t": "[Finis] ton travail !", "g": 1}, {"t": "[Regarde] bien !", "g": 0}, {"t": "[Prends] ta loupe !", "g": 1}, {"t": "[Va] chercher Hugo !", "g": 0}, {"t": "[Vas]-y vite !", "g": 1}], "hyps": [{"t": "À l'impératif, les verbes en -er (et aller, ouvrir, offrir, cueillir) n'ont pas de -s à la 2e personne du singulier ; les autres verbes en ont un. Devant « en » et « y », on ajoute un -s.", "ok": true, "r": ""}, {"t": "Comme on s'adresse à « tu », on met toujours un -s.", "ok": false, "r": "Contre-exemple : « Range ta chambre ! » — pas de -s."}, {"t": "« Va » et « Vas » s'écrivent au choix.", "ok": false, "r": "Contre-exemple : « Va chercher Hugo », mais « Vas-y » : le -s apparaît seulement devant « y »."}], "rule": "L'impératif présent n'a que trois personnes et pas de sujet exprimé (range, rangeons, rangez). À la 2e personne du singulier, les verbes en -er, ainsi qu'aller, ouvrir, offrir, cueillir, souffrir, n'ont pas de -s : « Range ! Ouvre ! Va ! ». Les autres verbes en ont un : « Finis ! Prends ! ». Devant « en » et « y », on ajoute un -s : « Vas-y ! Manges-en ! ».", "tool": "remplacer", "toolUse": "Compare avec « range » ou « finis » : si le verbe se conjugue comme « ranger », pas de -s.", "ex": "Ouvre la porte, prends la lampe et cherches-en une autre !", "piege": "Être, avoir, savoir, vouloir sont irréguliers : sois, aie, sache, veuille.", "note": null, "defis": [{"q": "___ la porte, s'il te plaît ! (fermer)", "a": "Ferme", "w": ["Fermes"], "why": "Verbe en -er : pas de -s."}, {"q": "___ ce message ! (lire)", "a": "Lis", "w": ["Lit", "Li"], "why": "3e groupe : -s."}, {"q": "Des pommes ? ___-en deux ! (manger)", "a": "Manges", "w": ["Mange"], "why": "Devant « en » : -s de liaison."}, {"q": "___ la fenêtre ! (ouvrir)", "a": "Ouvre", "w": ["Ouvres"], "why": "Ouvrir se conjugue ici comme un verbe en -er : pas de -s."}, {"q": "___ sage ! (être)", "a": "Sois", "w": ["Soit", "Sais"], "why": "Être : sois."}, {"q": "___-y tout de suite ! (aller)", "a": "Vas", "w": ["Va"], "why": "Devant « y » : -s de liaison."}], "terrain": [{"t": "{Ranges|Range} ton bureau avant de partir !", "why": "Verbe en -er à l'impératif : pas de -s."}, {"t": "{Va|Vas}-y, n'aie pas peur !", "why": "Devant « y », on ajoute un -s : « Vas-y »."}], "open": false}, {"num": 23, "id": "SI", "fam": "CONJ", "title": "Le système hypothétique", "lv": [4, 3], "affaire": "L'affaire du si piégé", "q": "Quels temps accompagnent « si » ?", "groups": ["si + présent → futur", "si + imparfait → conditionnel"], "corpus": [{"t": "Si tu [viens], je te montrerai.", "g": 0}, {"t": "Si tu [venais], je te montrerais.", "g": 1}, {"t": "S'il [pleut], nous resterons.", "g": 0}, {"t": "S'il [pleuvait], nous resterions.", "g": 1}, {"t": "Si elle [trouve] la clé, elle ouvrira.", "g": 0}, {"t": "Si elle [trouvait] la clé, elle ouvrirait.", "g": 1}], "hyps": [{"t": "Après « si », on peut mettre le conditionnel quand la situation est imaginaire.", "ok": false, "r": "Contre-exemple : on dit « Si tu venais », jamais « si tu viendrais » : après « si » de condition, pas de conditionnel."}, {"t": "« si » + présent → futur dans l'autre proposition (condition possible) ; « si » + imparfait → conditionnel (condition imaginaire ou peu probable).", "ok": true, "r": ""}, {"t": "Le verbe après « si » est au même temps que l'autre verbe.", "ok": false, "r": "Contre-exemple : « Si tu viens, je te montrerai » : présent après si, futur ensuite."}], "rule": "Le système hypothétique associe deux temps : si + présent → futur (ou impératif, présent) ; si + imparfait → conditionnel présent ; si + plus-que-parfait → conditionnel passé (si tu étais venu, je t'aurais montré). Jamais de futur ni de conditionnel juste après « si » de condition.", "tool": "changer-temps", "toolUse": "Repère le verbe après « si » : présent ou imparfait ? Le verbe de l'autre proposition suit la règle.", "ex": "Si j'avais su, je serais venu ; si je sais, je viendrai.", "piege": "Un « si » qui ne marque pas une condition échappe à la règle : « Je me demande s'il viendra » (interrogation indirecte).", "note": null, "defis": [{"q": "Si j'___ le temps, je viendrais. (avoir)", "a": "avais", "w": ["aurais", "aurai"], "why": "Si + imparfait → conditionnel."}, {"q": "Si tu cherches bien, tu ___ l'indice. (trouver)", "a": "trouveras", "w": ["trouverais", "trouvais"], "why": "Si + présent → futur."}, {"q": "S'il ___ beau, nous sortirions. (faire)", "a": "faisait", "w": ["ferait", "fera"], "why": "Si + imparfait → conditionnel."}, {"q": "Si vous m'aviez prévenu, je ___ venu. (être)", "a": "serais", "w": ["serai", "étais"], "why": "Si + plus-que-parfait → conditionnel passé."}, {"q": "Je me demande s'il ___ demain. (venir)", "a": "viendra", "w": ["venait", "vienne"], "why": "Interrogation indirecte, pas une condition : le futur est possible."}, {"q": "Si elle ___ la vérité, elle la dirait. (connaître)", "a": "connaissait", "w": ["connaîtrait", "connaîtra"], "why": "Si + imparfait → conditionnel."}], "terrain": [{"t": "Si j'{aurais|avais} une loupe, je verrais mieux.", "why": "Après « si » de condition, jamais de conditionnel : « si j'avais »."}, {"t": "Si tu viens, je te {montrerais|montrerai} le passage.", "why": "Si + présent → futur : « je te montrerai »."}], "open": false}, {"num": 24, "id": "NAT", "fam": "GRAM", "title": "Classes de mots", "lv": [6, 5], "affaire": "L'affaire de l'identité des mots", "q": "Comment reconnaître la classe (nature) d'un mot ?", "groups": ["nom", "adjectif", "verbe", "adverbe"], "corpus": [{"t": "Le [détective] observe.", "g": 0}, {"t": "Un indice [précieux].", "g": 1}, {"t": "Elle [cherche] partout.", "g": 2}, {"t": "Il avance [lentement].", "g": 3}, {"t": "La [nuit] tombe.", "g": 0}, {"t": "Un couloir [sombre].", "g": 1}, {"t": "Ils [murmurent].", "g": 2}, {"t": "Elle parle [doucement].", "g": 3}], "hyps": [{"t": "On reconnaît la classe d'un mot à son comportement : le nom accepte un déterminant, l'adjectif qualifie un nom et s'accorde, le verbe se conjugue, l'adverbe ne varie pas.", "ok": true, "r": ""}, {"t": "Les noms désignent des objets qu'on peut toucher.", "ok": false, "r": "Contre-exemple : « la nuit » est un nom, et on ne peut pas la toucher."}, {"t": "Tous les mots en -ment sont des adverbes.", "ok": false, "r": "Contre-exemple : « un monument », « un document » sont des noms."}], "rule": "Les mots se rangent en classes (ou natures) : nom, déterminant, adjectif, pronom, verbe (variables) ; adverbe, préposition, conjonction (invariables). On reconnaît la classe d'un mot par des manipulations : mettre un déterminant devant un nom, conjuguer un verbe, mettre un adjectif au féminin, vérifier qu'un adverbe ne change pas.", "tool": "changer-nombre", "toolUse": "Fais varier le mot : « un couloir sombre / des couloirs sombres » (adjectif variable) ; « il parle doucement / ils parlent doucement » (adverbe invariable).", "ex": "Le (déterminant) vieux (adjectif) gardien (nom) ferme (verbe) soigneusement (adverbe) la porte.", "piege": "Un même mot peut changer de classe : « Il ferme la porte » (verbe), « une ferme » (nom), « une voix ferme » (adjectif).", "note": null, "defis": [{"q": "Dans « Elle court vite », « vite » est :", "a": "un adverbe", "w": ["un adjectif", "un verbe"], "why": "Invariable, il modifie le verbe « court »."}, {"q": "Dans « une piste sérieuse », « sérieuse » est :", "a": "un adjectif", "w": ["un nom", "un adverbe"], "why": "Il qualifie le nom « piste » et s'accorde."}, {"q": "Dans « Le silence règne », « silence » est :", "a": "un nom", "w": ["un adjectif", "un verbe"], "why": "Il est précédé du déterminant « le »."}, {"q": "Dans « Je le vois », « le » est :", "a": "un pronom", "w": ["un déterminant", "un nom"], "why": "Il remplace un nom et n'est pas suivi d'un nom."}, {"q": "Dans « Il part avec Hugo », « avec » est :", "a": "une préposition", "w": ["une conjonction", "un adverbe"], "why": "Mot invariable qui introduit un complément."}, {"q": "Dans « Il hésite mais avance », « mais » est :", "a": "une conjonction de coordination", "w": ["une préposition", "un adverbe"], "why": "Il relie deux verbes."}], "terrain": [{"t": "Il avance {lentemment|lentement} dans le couloir.", "why": "Adverbe formé sur le féminin « lente » + -ment : « lentement »."}, {"t": "Elle répond {gentiement|gentiment}.", "why": "« gentil » donne l'adverbe « gentiment » (forme à retenir)."}], "open": false}, {"num": 25, "id": "FCT", "fam": "GRAM", "title": "Sujet, COD, COI", "lv": [6, 5, 4], "affaire": "L'affaire des rôles dans la phrase", "q": "Quel rôle joue chaque groupe autour du verbe ?", "groups": ["sujet", "COD", "COI"], "corpus": [{"t": "[Le chat] dort.", "g": 0}, {"t": "Hugo ouvre [la porte].", "g": 1}, {"t": "Margot parle [à Nadia].", "g": 2}, {"t": "[Les témoins] mentent.", "g": 0}, {"t": "Nadia observe [les traces].", "g": 1}, {"t": "Il pense [à son enquête].", "g": 2}], "hyps": [{"t": "Le sujet répond à « qui est-ce qui ? » ; le COD à « quoi ? qui ? » juste après le verbe, sans préposition ; le COI est introduit par une préposition (à, de).", "ok": true, "r": ""}, {"t": "Le COD est toujours une chose.", "ok": false, "r": "Contre-exemple : « J'observe Hugo » — « Hugo » est COD, et c'est une personne."}, {"t": "Le sujet est toujours le premier mot de la phrase.", "ok": false, "r": "Contre-exemple : « Dans la cave dorment les chats » — le sujet est « les chats »."}], "rule": "Le sujet commande l'accord du verbe (on l'encadre avec « c'est… qui »). Le complément d'objet direct (COD) suit le verbe sans préposition et se remplace par le, la, les. Le complément d'objet indirect (COI) est introduit par une préposition (à, de) et se remplace par lui, leur, en, y. Ces compléments sont essentiels : on ne peut généralement ni les supprimer ni les déplacer.", "tool": "pronominaliser", "toolUse": "Remplace par un pronom : « Hugo ouvre la porte » → « Hugo l'ouvre » (COD) ; « Margot parle à Nadia » → « Margot lui parle » (COI).", "ex": "Le gardien (sujet) confie la clé (COD) à Margot (COI).", "piege": "Les pronoms ont aussi une fonction : « Je le lui donne » → le = COD, lui = COI.", "note": null, "defis": [{"q": "Dans « Le vent emporte les feuilles », « les feuilles » est :", "a": "COD", "w": ["sujet", "COI"], "why": "« Le vent emporte quoi ? », sans préposition : COD."}, {"q": "Dans « Elle obéit à ses parents », « à ses parents » est :", "a": "COI", "w": ["COD", "sujet"], "why": "Introduit par « à » : COI."}, {"q": "Dans « Au loin brillent les étoiles », le sujet est :", "a": "les étoiles", "w": ["au loin", "brillent"], "why": "« Qu'est-ce qui brille ? Les étoiles. »"}, {"q": "Dans « Je la vois », « la » est :", "a": "COD", "w": ["COI", "sujet"], "why": "« Je vois qui ? » : pronom COD."}, {"q": "Dans « Il se souvient de cette nuit », « de cette nuit » est :", "a": "COI", "w": ["COD", "complément circonstanciel"], "why": "Se souvenir de quelque chose : COI."}, {"q": "Dans « Nous leur écrivons », « leur » est :", "a": "COI", "w": ["COD", "sujet"], "why": "Écrire à eux : COI."}], "terrain": [{"t": "Les élèves {écoute|écoutent} le guide.", "why": "Le sujet « les élèves » est pluriel : « écoutent »."}, {"t": "Ces lettres, je {leur|les} ai lues.", "why": "Lire quelque chose : COD → pronom « les »."}], "open": false}, {"num": 26, "id": "CC", "fam": "GRAM", "title": "Compléments circonstanciels", "lv": [5, 4, 3], "affaire": "L'affaire des circonstances", "q": "Quels groupes donnent les circonstances de l'action ?", "groups": ["temps", "lieu", "cause", "but"], "corpus": [{"t": "[Ce soir], nous enquêterons.", "g": 0}, {"t": "Il se cache [dans la cave].", "g": 1}, {"t": "Elle tremble [de peur].", "g": 2}, {"t": "Il court [pour attraper le train].", "g": 3}, {"t": "[Depuis lundi], il pleut.", "g": 0}, {"t": "[Sous le lit], on trouva une clé.", "g": 1}, {"t": "Il est absent [à cause de la grève].", "g": 2}, {"t": "Elle note tout [afin de ne rien oublier].", "g": 3}], "hyps": [{"t": "Les compléments circonstanciels précisent quand, où, pourquoi, dans quel but, comment ; on peut souvent les supprimer ou les déplacer.", "ok": true, "r": ""}, {"t": "Un complément circonstanciel est toujours en début de phrase.", "ok": false, "r": "Contre-exemple : « Il se cache dans la cave » — le complément est en fin de phrase."}, {"t": "Tout groupe introduit par une préposition est un complément circonstanciel.", "ok": false, "r": "Contre-exemple : « Il pense à son enquête » — « à son enquête » est un COI, qu'on ne peut pas supprimer."}], "rule": "Les compléments circonstanciels (CC) indiquent les circonstances de l'action : temps, lieu, manière, moyen, cause, conséquence, but, condition, opposition… Ce peut être un groupe nominal (ce soir), un groupe prépositionnel (dans la cave), un adverbe (ici), un infinitif (pour partir) ou une proposition subordonnée (quand il arriva). La plupart se suppriment ou se déplacent.", "tool": "deplacer", "toolUse": "Déplace puis supprime le groupe : « Ce soir, nous enquêterons » → « Nous enquêterons ce soir » → « Nous enquêterons » : la phrase reste correcte → CC.", "ex": "Hier soir (temps), au manoir (lieu), Hugo a crié de joie (cause).", "piege": "Un CC placé en tête de phrase est souvent suivi d'une virgule (voir le code 39).", "note": null, "defis": [{"q": "Dans « Elle travaille pour réussir », « pour réussir » indique :", "a": "le but", "w": ["la cause", "le temps"], "why": "« Dans quel but ? »"}, {"q": "Dans « Il est resté chez lui à cause de la pluie », le CC de cause est :", "a": "à cause de la pluie", "w": ["chez lui", "il est resté"], "why": "« Pourquoi ? À cause de la pluie. »"}, {"q": "Dans « Elle écrit avec un stylo plume », le CC indique :", "a": "le moyen", "w": ["le lieu", "la cause"], "why": "« Avec quoi ? » : moyen."}, {"q": "Quel groupe est un CC de lieu ?", "a": "derrière la porte", "w": ["à son frère", "la porte"], "why": "Il répond à « où ? » et peut se déplacer."}, {"q": "Dans « Il parle doucement », « doucement » indique :", "a": "la manière", "w": ["le temps", "le but"], "why": "« Comment ? »"}, {"q": "Quel groupe ne peut pas être supprimé dans « Il obéit à sa mère depuis toujours » ?", "a": "à sa mère", "w": ["depuis toujours"], "why": "« à sa mère » est COI, essentiel au verbe."}], "terrain": [{"t": "Il est absent {à cause qu'|parce qu'}il est malade.", "why": "« à cause de » est suivi d'un nom ; devant une proposition, on emploie « parce que »."}, {"t": "{Malgré qu'|Bien qu'}il pleuve, ils sortent.", "why": "« malgré » est suivi d'un nom ; devant une proposition, on écrit « bien que »."}], "open": false}, {"num": 27, "id": "EXP", "fam": "GRAM", "title": "Épithète, apposition, complément du nom", "lv": [4, 3], "affaire": "L'affaire des précisions du nom", "q": "De combien de façons peut-on compléter un nom ?", "groups": ["épithète", "apposition", "complément du nom"], "corpus": [{"t": "un [vieux] manoir", "g": 0}, {"t": "Hugo, [le plus jeune], parla.", "g": 1}, {"t": "la clé [du coffre]", "g": 2}, {"t": "une lettre [mystérieuse]", "g": 0}, {"t": "[Inquiète], Margot recula.", "g": 1}, {"t": "un sac [en cuir]", "g": 2}], "hyps": [{"t": "L'épithète est un adjectif collé au nom ; l'apposition est détachée par une virgule ; le complément du nom est introduit par une préposition (de, en, à…).", "ok": true, "r": ""}, {"t": "Tous les adjectifs sont épithètes.", "ok": false, "r": "Contre-exemple : « Inquiète, Margot recula » — l'adjectif est détaché : c'est une apposition."}, {"t": "Le complément du nom complète un verbe.", "ok": false, "r": "Contre-exemple : « la clé du coffre » — « du coffre » complète le nom « clé »."}], "rule": "Expansions du nom : l'épithète est un adjectif placé directement à côté du nom (un vieux manoir) ; l'apposition est un mot ou un groupe détaché du nom par une virgule (ou deux-points), qui apporte une précision (Hugo, le plus jeune, …) ; le complément du nom est un groupe introduit par une préposition (la clé du coffre, un sac en cuir). Toutes ces expansions peuvent être supprimées.", "tool": "supprimer", "toolUse": "Efface l'expansion : « un vieux manoir » → « un manoir » ; si elle était entre virgules, c'est une apposition.", "ex": "Le gardien, un homme taciturne, ouvrit la lourde porte de la crypte.", "piege": "L'apposition s'accorde avec le nom qu'elle complète : « Inquiètes, elles reculèrent ».", "note": null, "defis": [{"q": "Dans « un regard perçant », « perçant » est :", "a": "épithète", "w": ["apposition", "complément du nom"], "why": "Adjectif collé au nom."}, {"q": "Dans « une boîte à musique », « à musique » est :", "a": "complément du nom", "w": ["épithète", "COI"], "why": "Groupe prépositionnel qui complète « boîte »."}, {"q": "Dans « Furieux, il claqua la porte », « furieux » est :", "a": "apposition", "w": ["épithète", "attribut"], "why": "Détaché par une virgule."}, {"q": "Dans « Lyon, ville des lumières, … », « ville des lumières » est :", "a": "apposition", "w": ["complément du nom", "épithète"], "why": "Groupe détaché par des virgules."}, {"q": "Dans « le chapeau de Sacha », « de Sacha » est :", "a": "complément du nom", "w": ["COI", "apposition"], "why": "Il complète le nom « chapeau »."}, {"q": "Quelle apposition est bien accordée ?", "a": "Épuisées, elles s'assirent.", "w": ["Épuisé, elles s'assirent.", "Épuisés, elles s'assirent."], "why": "L'apposition s'accorde avec « elles » (féminin pluriel)."}], "terrain": [{"t": "{Fatigué|Fatiguée}, Nadia s'arrêta.", "why": "L'apposition s'accorde avec « Nadia » : « Fatiguée »."}, {"t": "Il portait une veste {de cuire|de cuir}.", "why": "Le complément du nom désigne la matière : le nom « cuir »."}], "open": false}, {"num": 28, "id": "PASS", "fam": "GRAM", "title": "La voix passive", "lv": [4, 3], "affaire": "L'affaire du coupable inversé", "q": "Le chat mange la souris, la souris est mangée : qui fait l'action ?", "groups": ["voix active", "voix passive"], "corpus": [{"t": "Le chat [mange] la souris.", "g": 0}, {"t": "La souris [est mangée] par le chat.", "g": 1}, {"t": "Le gardien [a fermé] la grille.", "g": 0}, {"t": "La grille [a été fermée] par le gardien.", "g": 1}, {"t": "La police [interroge] les témoins.", "g": 0}, {"t": "Les témoins [sont interrogés].", "g": 1}], "hyps": [{"t": "À la voix passive, le sujet subit l'action ; le verbe se forme avec être + participe passé, et celui qui agit devient complément d'agent (par…), parfois absent.", "ok": true, "r": ""}, {"t": "Toute phrase avec le verbe être est à la voix passive.", "ok": false, "r": "Contre-exemple : « La porte est rouge » — être + adjectif, aucune action subie ; « Il est parti » : passé composé actif."}, {"t": "La voix passive est un temps du passé.", "ok": false, "r": "Contre-exemple : « La souris est mangée » — c'est du présent."}], "rule": "À la voix active, le sujet fait l'action. À la voix passive, il la subit : le COD de la phrase active devient sujet, le verbe se construit avec être (au temps de la phrase active) + participe passé accordé avec le sujet, et le sujet actif devient complément d'agent introduit par « par » ou « de ». Le complément d'agent peut être absent.", "tool": "transformer", "toolUse": "Retourne la phrase : « Le gardien a fermé la grille » → « La grille a été fermée par le gardien ». Le temps reste le passé composé (a fermé → a été fermée).", "ex": "Le manoir était habité par un vieux comte.", "piege": "Le participe passif s'accorde avec le sujet : « Les lettres ont été retrouvées ».", "note": null, "defis": [{"q": "Mets au passif : « Le vent pousse la porte. »", "a": "La porte est poussée par le vent.", "w": ["La porte a poussé le vent.", "La porte était poussée par le vent."], "why": "Présent actif → être au présent + participe."}, {"q": "Dans « Le suspect a été arrêté par la police », le complément d'agent est :", "a": "par la police", "w": ["le suspect", "a été arrêté"], "why": "Celui qui fait l'action, introduit par « par »."}, {"q": "Quelle phrase est à la voix passive ?", "a": "Le tableau a été volé.", "w": ["Le voleur est entré.", "Le tableau est ancien."], "why": "Être + participe, et le sujet subit l'action."}, {"q": "Les lettres ont été ___ par Hugo.", "a": "retrouvées", "w": ["retrouvé", "retrouvés"], "why": "Le participe passif s'accorde avec le sujet (féminin pluriel)."}, {"q": "Mets à l'actif : « Le château fut construit par le comte. »", "a": "Le comte construisit le château.", "w": ["Le comte fut construit par le château.", "Le château construisit le comte."], "why": "Passé simple passif → passé simple actif."}, {"q": "« Elle est aimée de tous » : le complément d'agent est introduit par :", "a": "de", "w": ["par", "elle"], "why": "Avec certains verbes (aimer, connaître), on emploie « de »."}], "terrain": [{"t": "La porte a été {ouvert|ouverte} par le vent.", "why": "Le participe passif s'accorde avec le sujet « la porte »."}, {"t": "Les témoins ont été {interrogé|interrogés}.", "why": "Accord avec « les témoins » (masculin pluriel)."}], "open": false}, {"num": 29, "id": "PHR", "fam": "SYN", "title": "Phrase incomplète", "lv": [6], "affaire": "L'affaire de la phrase coupée", "q": "Qu'est-ce qui rend une phrase complète ?", "groups": ["phrase complète", "phrase incomplète"], "corpus": [{"t": "[Le témoin arrive.]", "g": 0}, {"t": "[Parce qu'il pleuvait.]", "g": 1}, {"t": "[Quand nous sommes sortis, il faisait nuit.]", "g": 0}, {"t": "[Quand nous sommes sortis.]", "g": 1}, {"t": "[Hugo cherche la clé qu'il a perdue.]", "g": 0}, {"t": "[La clé qu'il a perdue.]", "g": 1}], "hyps": [{"t": "Une phrase verbale complète a au moins un verbe principal ; une subordonnée (parce que…, quand…) ou un groupe nominal seul ne suffit pas.", "ok": true, "r": ""}, {"t": "Une phrase est complète dès qu'elle contient un verbe conjugué.", "ok": false, "r": "Contre-exemple : « Parce qu'il pleuvait. » contient un verbe conjugué, mais il manque la proposition principale."}, {"t": "Une phrase courte est incomplète.", "ok": false, "r": "Contre-exemple : « Le témoin arrive. » est courte et complète."}], "rule": "Une phrase verbale s'organise autour d'un verbe conjugué principal. Une proposition subordonnée (introduite par parce que, quand, qui, que…) ne peut pas former une phrase seule : elle dépend d'une proposition principale. À l'écrit, on rattache la subordonnée à la principale (souvent avec une virgule).", "tool": "supprimer", "toolUse": "Efface la subordonnée : s'il ne reste rien, la phrase est incomplète. « Quand nous sommes sortis, il faisait nuit » → « il faisait nuit » reste : la principale est là.", "ex": "Parce qu'il pleuvait, nous sommes restés au manoir.", "piege": "À l'oral, on dit souvent des phrases incomplètes (« Parce que ! ») ; à l'écrit, on les complète.", "note": null, "defis": [{"q": "Quelle phrase est complète ?", "a": "Comme il faisait froid, Nadia ferma la fenêtre.", "w": ["Comme il faisait froid.", "Parce que la fenêtre."], "why": "Elle contient une principale : « Nadia ferma la fenêtre »."}, {"q": "« Le livre que tu m'as prêté. » est une phrase :", "a": "incomplète", "w": ["complète"], "why": "Pas de verbe principal : « que tu m'as prêté » est une subordonnée."}, {"q": "Comment compléter « Si tu veux. » ?", "a": "Si tu veux, nous partirons ensemble.", "w": ["Si tu veux, et nous partirons.", "Si tu veux. Nous partirons."], "why": "La subordonnée est rattachée à une principale."}, {"q": "Quelle phrase est incomplète ?", "a": "Pendant que Hugo dormait.", "w": ["Hugo dormait.", "Pendant que Hugo dormait, la neige tombait."], "why": "Subordonnée seule."}, {"q": "« Quel orage ! » est :", "a": "une phrase non verbale correcte", "w": ["une phrase incomplète à corriger"], "why": "Les phrases non verbales sont possibles (exclamations, titres)."}, {"q": "Choisis l'ordre correct :", "a": "Elle lit un livre.", "w": ["Lit elle un livre.", "Elle un livre lit."], "why": "Phrase déclarative : sujet, verbe, complément."}], "terrain": [{"t": "Nous sommes restés à l'intérieur{. Parce| parce} qu'il pleuvait.", "why": "La subordonnée « parce qu'il pleuvait » doit rester rattachée à la principale."}, {"t": "{Quand le soleil s'est couché.|Quand le soleil s'est couché,} les loups ont hurlé.", "why": "La subordonnée se rattache à la principale par une virgule."}], "open": false}, {"num": 30, "id": "REL", "fam": "SYN", "title": "Pronoms relatifs", "lv": [5, 4], "affaire": "L'affaire des relatifs", "q": "qui, que, dont, où : comment choisir ?", "groups": ["qui", "que", "dont", "où"], "corpus": [{"t": "Le témoin [qui] parle ment.", "g": 0}, {"t": "Le livre [que] je lis est ancien.", "g": 1}, {"t": "L'affaire [dont] je te parle est grave.", "g": 2}, {"t": "La ville [où] je suis né est loin.", "g": 3}, {"t": "La porte [qui] grince est ouverte.", "g": 0}, {"t": "L'indice [que] tu cherches est ici.", "g": 1}, {"t": "Le témoin [dont] tu as noté le nom a fui.", "g": 2}, {"t": "Le jour [où] il partit, il neigeait.", "g": 3}], "hyps": [{"t": "Le choix du relatif dépend de sa fonction dans la relative : qui = sujet, que = COD, dont = complément introduit par « de », où = lieu ou temps.", "ok": true, "r": ""}, {"t": "« qui » s'emploie pour les personnes, « que » pour les choses.", "ok": false, "r": "Contre-exemple : « La porte qui grince » — « qui » pour une chose."}, {"t": "« dont » et « que » sont interchangeables.", "ok": false, "r": "Contre-exemple : on dit « l'affaire dont je te parle » (parler de), pas « l'affaire que je te parle »."}], "rule": "Le pronom relatif introduit une proposition subordonnée relative et reprend un antécédent. Sa forme dépend de sa fonction : qui (sujet du verbe de la relative), que (COD), dont (complément construit avec « de » : parler de, avoir besoin de, le nom de…), où (complément de lieu ou de temps). Formes composées : lequel, auquel, duquel (avec une préposition).", "tool": "transformer", "toolUse": "Coupe en deux phrases : « Je te parle de l'affaire » → « de » → dont. « Je lis le livre » → COD → que.", "ex": "La maison où j'habite, que tu connais et dont je t'ai parlé, est vieille.", "piege": "À l'écrit, on évite « que » à la place de « dont » : « le film dont j'ai envie » (avoir envie de).", "note": null, "defis": [{"q": "L'outil ___ j'ai besoin est cassé.", "a": "dont", "w": ["que", "qui"], "why": "Avoir besoin de : « dont »."}, {"q": "La pièce ___ il se cache est fermée.", "a": "où", "w": ["que", "dont"], "why": "Lieu : « où »."}, {"q": "La femme ___ arrive est l'inspectrice.", "a": "qui", "w": ["que", "dont"], "why": "Sujet de « arrive » : « qui »."}, {"q": "La lettre ___ tu as écrite est arrivée.", "a": "que", "w": ["qui", "dont"], "why": "COD de « as écrite » : « que »."}, {"q": "C'est l'époque ___ tout était calme.", "a": "où", "w": ["que", "dont"], "why": "Moment : « où »."}, {"q": "C'est un détail ___ je me souviens.", "a": "dont", "w": ["que", "où"], "why": "Se souvenir de : « dont »."}], "terrain": [{"t": "Le film {que|dont} je t'ai parlé passe ce soir.", "why": "Parler de quelque chose : « dont »."}, {"t": "La rue {que|où} j'habite est calme.", "why": "Lieu : « où »."}], "open": false}, {"num": 31, "id": "NEG", "fam": "SYN", "title": "La négation", "lv": [6, 5], "affaire": "L'affaire de la négation fantôme", "q": "De quoi a besoin une négation à l'écrit ?", "groups": ["négation complète", "négation à compléter"], "corpus": [{"t": "Je [ne] comprends [pas].", "g": 0}, {"t": "Je comprends [pas].", "g": 1}, {"t": "Il [n']a [rien] vu.", "g": 0}, {"t": "Il a [rien] vu.", "g": 1}, {"t": "[Personne ne] répond.", "g": 0}, {"t": "[Personne] répond.", "g": 1}], "hyps": [{"t": "À l'écrit, la négation a deux éléments : « ne » (ou n') + pas, plus, rien, jamais, personne… ; le « ne » ne disparaît pas.", "ok": true, "r": ""}, {"t": "« pas » suffit pour faire une négation.", "ok": false, "r": "Contre-exemple : « Je comprends pas » se dit à l'oral, mais à l'écrit il manque « ne »."}, {"t": "« ne » se place après le verbe.", "ok": false, "r": "Contre-exemple : « Je ne comprends pas » — « ne » est avant le verbe."}], "rule": "À l'écrit, la négation se construit avec deux éléments qui encadrent le verbe conjugué (ou l'auxiliaire) : ne… pas, ne… plus, ne… jamais, ne… rien, ne… personne, ne… aucun. Devant une voyelle, ne devient n'. Avec « personne », « rien », « aucun » sujets, ne suit : « Personne ne répond ». Le ne est souvent avalé à l'oral, jamais à l'écrit.", "tool": "transformer", "toolUse": "Passe de l'affirmative à la négative en encadrant le verbe : « Il a vu » → « Il n'a rien vu ».", "ex": "On n'entend plus rien : personne n'ose parler.", "piege": "Avec « on » devant une voyelle, on n'oublie pas le n' : « On n'a rien trouvé ».", "note": null, "defis": [{"q": "Quelle phrase est correcte à l'écrit ?", "a": "Je ne sais pas.", "w": ["Je sais pas.", "Je ne sais."], "why": "Négation complète : ne… pas."}, {"q": "On ___ jamais vu ça.", "a": "n'a", "w": ["a", "ne a"], "why": "Devant une voyelle, ne → n' : « On n'a jamais vu »."}, {"q": "___ ne connaît la vérité.", "a": "Personne", "w": ["Personne pas", "Pas personne"], "why": "« Personne » sujet + ne."}, {"q": "Il ___ veut plus venir.", "a": "ne", "w": ["n'", "pas"], "why": "Ne… plus encadre le verbe."}, {"q": "Quelle phrase est correcte ?", "a": "Ils n'ont rien dit.", "w": ["Ils ont rien dit.", "Ils n'ont dit."], "why": "Ne… rien."}, {"q": "Elle préfère ne ___ parler.", "a": "pas", "w": ["ne", "plus pas"], "why": "Avec un infinitif, les deux éléments se placent avant : « ne pas parler »."}], "terrain": [{"t": "On {a|n'a} rien trouvé dans la cave.", "why": "À l'écrit, la négation a deux éléments : « on n'a rien »."}, {"t": "Je {sais|ne sais} pas où il est.", "why": "Il manque « ne » : « je ne sais pas »."}], "open": false}, {"num": 32, "id": "PROP", "fam": "SYN", "title": "Juxtaposition, coordination, subordination", "lv": [5, 4, 3], "affaire": "L'affaire des propositions liées", "q": "Comment les propositions d'une phrase sont-elles reliées ?", "groups": ["juxtaposées", "coordonnées", "subordonnée"], "corpus": [{"t": "[Il pleut, nous restons.]", "g": 0}, {"t": "[Il pleut, donc nous restons.]", "g": 1}, {"t": "[Comme il pleut, nous restons.]", "g": 2}, {"t": "[Le chien aboie ; le chat fuit.]", "g": 0}, {"t": "[Le chien aboie et le chat fuit.]", "g": 1}, {"t": "[Quand le chien aboie, le chat fuit.]", "g": 2}], "hyps": [{"t": "Juxtaposées : séparées par une ponctuation ; coordonnées : reliées par mais, ou, et, donc, or, ni, car ; subordonnée : elle dépend d'une principale grâce à un mot subordonnant (comme, quand, que…).", "ok": true, "r": ""}, {"t": "Il y a autant de propositions que de virgules.", "ok": false, "r": "Contre-exemple : « Le chien aboie et le chat fuit » — deux propositions, aucune virgule."}, {"t": "Une subordonnée est toujours placée après la principale.", "ok": false, "r": "Contre-exemple : « Comme il pleut, nous restons » — la subordonnée est en tête."}], "rule": "Une phrase complexe contient plusieurs propositions (en général, une par verbe conjugué). Elles peuvent être juxtaposées (virgule, point-virgule, deux-points), coordonnées (mais, ou, et, donc, or, ni, car, ou un adverbe comme puis, ensuite) ou liées par subordination : la subordonnée, introduite par un mot subordonnant (que, quand, comme, parce que, qui, si…), dépend de la principale.", "tool": "supprimer", "toolUse": "Efface une proposition : si l'autre tient seule, c'est une principale ou une indépendante ; si elle ne tient pas seule (« Comme il pleut. »), c'est une subordonnée.", "ex": "Il hésita, puis il entra : la salle était vide, car tout le monde était parti.", "piege": "Compte les verbes conjugués pour compter les propositions.", "note": null, "defis": [{"q": "« Il a froid car la fenêtre est ouverte » : les propositions sont :", "a": "coordonnées", "w": ["juxtaposées", "subordonnées"], "why": "« car » est une conjonction de coordination."}, {"q": "« Je pense que tu as raison » : « que tu as raison » est :", "a": "une subordonnée", "w": ["une principale", "une coordonnée"], "why": "Introduite par « que », elle dépend de « je pense »."}, {"q": "Combien de propositions dans « Elle entre, regarde, puis repart » ?", "a": "trois", "w": ["deux", "une"], "why": "Trois verbes conjugués."}, {"q": "« Il pleuvait ; personne ne sortait. » : les propositions sont :", "a": "juxtaposées", "w": ["coordonnées", "subordonnées"], "why": "Séparées par un point-virgule."}, {"q": "Quel mot est une conjonction de coordination ?", "a": "or", "w": ["quand", "comme"], "why": "Mais, ou, et, donc, or, ni, car."}, {"q": "« Quand il arriva, tout le monde se tut » : la principale est :", "a": "tout le monde se tut", "w": ["quand il arriva"], "why": "Elle peut fonctionner seule."}], "terrain": [{"t": "Il hésitait {et mais|mais} il entra.", "why": "On n'accumule pas deux conjonctions de coordination : « mais » suffit."}, {"t": "Comme il pleuvait{, alors|,} nous sommes restés.", "why": "« Comme » introduit déjà la cause : « alors » fait doublon."}], "open": false}, {"num": 33, "id": "SUB", "fam": "SYN", "title": "Subordonnées circonstancielles", "lv": [4, 3], "affaire": "L'affaire des liens logiques", "q": "Quel rapport logique chaque subordonnée exprime-t-elle ?", "groups": ["cause", "conséquence", "but", "concession"], "corpus": [{"t": "Il reste [parce qu'il pleut].", "g": 0}, {"t": "Il pleut [si fort qu'on reste].", "g": 1}, {"t": "Il parle bas [pour qu'on ne l'entende pas].", "g": 2}, {"t": "[Bien qu'il pleuve], il sort.", "g": 3}, {"t": "[Comme il était tard], il partit.", "g": 0}, {"t": "Il courut [si vite qu'il tomba].", "g": 1}, {"t": "Je t'écris [afin que tu saches tout].", "g": 2}, {"t": "[Même s'il a peur], il avance.", "g": 3}], "hyps": [{"t": "Le mot subordonnant indique le rapport logique : parce que, comme (cause) ; si… que, de sorte que (conséquence) ; pour que, afin que (but) ; bien que, même si (concession).", "ok": true, "r": ""}, {"t": "Une subordonnée de cause est toujours introduite par « parce que ».", "ok": false, "r": "Contre-exemple : « Comme il était tard, il partit » — cause introduite par « comme »."}, {"t": "Le but et la conséquence, c'est la même chose.", "ok": false, "r": "Contre-exemple : « pour qu'on ne l'entende pas » (intention, subjonctif) ≠ « si vite qu'il tomba » (résultat réel, indicatif)."}], "rule": "Les subordonnées circonstancielles jouent le rôle de compléments circonstanciels de la principale. Cause : parce que, puisque, comme (indicatif). Conséquence : si bien que, de sorte que, si… que, tellement… que (indicatif). But : pour que, afin que (subjonctif). Concession / opposition : bien que, quoique (subjonctif), même si, alors que (indicatif). Temps : quand, lorsque, pendant que (indicatif), avant que (subjonctif), après que (indicatif). Condition : si (voir le code 23).", "tool": "remplacer", "toolUse": "Remplace le subordonnant par un autre de même sens : « parce que » → « puisque » (cause). Si le sens change, ce n'est pas le même rapport.", "ex": "Bien qu'il fût tard, ils continuèrent afin que tout soit prêt, si bien qu'à l'aube, ils dormaient.", "piege": "Le mode compte : « pour que tu viennes » (subjonctif), « parce que tu viens » (indicatif).", "note": null, "defis": [{"q": "« Il s'entraîne pour qu'on le sélectionne » exprime :", "a": "le but", "w": ["la cause", "la conséquence"], "why": "Intention : « pour que » + subjonctif."}, {"q": "« Il était si fatigué qu'il s'endormit » exprime :", "a": "la conséquence", "w": ["le but", "la concession"], "why": "Résultat : « si… que »."}, {"q": "« Même s'il fait froid, nous sortirons » exprime :", "a": "la concession", "w": ["la cause", "le temps"], "why": "Opposition à ce qu'on attendrait."}, {"q": "« Puisque tu insistes, je viens » exprime :", "a": "la cause", "w": ["la conséquence", "le but"], "why": "« puisque » : cause."}, {"q": "Afin que vous ___ tout, je répète. (comprendre)", "a": "compreniez", "w": ["comprenez", "comprendrez"], "why": "« afin que » + subjonctif."}, {"q": "Il est parti avant que nous ___. (arriver)", "a": "arrivions", "w": ["arrivons", "arriverons"], "why": "« avant que » + subjonctif."}], "terrain": [{"t": "Je parle fort pour que tu {m'entends|m'entendes}.", "why": "« pour que » + subjonctif : « que tu m'entendes »."}, {"t": "Bien qu'il {est|soit} malade, il vient.", "why": "« bien que » + subjonctif : « qu'il soit »."}], "open": false}, {"num": 34, "id": "DISC", "fam": "SYN", "title": "Le discours rapporté", "lv": [4, 3], "affaire": "L'affaire des paroles rapportées", "q": "Que se passe-t-il quand on rapporte les paroles de quelqu'un sans guillemets ?", "groups": ["discours direct", "discours indirect"], "corpus": [{"t": "[Il dit : « J'ai peur. »]", "g": 0}, {"t": "[Il dit qu'il a peur.]", "g": 1}, {"t": "[Elle demande : « Où es-tu ? »]", "g": 0}, {"t": "[Elle demande où je suis.]", "g": 1}, {"t": "[Il annonça : « Je partirai demain. »]", "g": 0}, {"t": "[Il annonça qu'il partirait le lendemain.]", "g": 1}], "hyps": [{"t": "Au discours indirect, les paroles sont intégrées dans une subordonnée : guillemets et point d'interrogation disparaissent ; pronoms, temps et repères de temps changent.", "ok": true, "r": ""}, {"t": "Au discours indirect, on garde les mêmes mots en enlevant juste les guillemets.", "ok": false, "r": "Contre-exemple : « J'ai peur » devient « qu'il a peur » : le pronom change."}, {"t": "Le temps du verbe ne change jamais.", "ok": false, "r": "Contre-exemple : « Je partirai demain » → « qu'il partirait le lendemain » : futur → conditionnel, demain → le lendemain."}], "rule": "Discours direct : paroles rapportées telles quelles, entre guillemets, après deux-points (ou avec tirets dans un dialogue). Discours indirect : paroles intégrées dans une subordonnée (dire que, demander si, où, ce que…), sans guillemets ni point d'interrogation. Les pronoms et possessifs changent (je → il) ; si le verbe introducteur est au passé, les temps changent (présent → imparfait, futur → conditionnel, passé composé → plus-que-parfait) ; les repères aussi (demain → le lendemain, ici → là).", "tool": "transformer", "toolUse": "Transforme pas à pas : 1) verbe introducteur + que ou si ; 2) pronoms ; 3) temps ; 4) repères de temps et de lieu.", "ex": "« Je viendrai ici demain », promit-il. → Il promit qu'il viendrait là le lendemain.", "piege": "Au discours indirect, pas d'inversion du sujet : « Il demande où je vais ».", "note": null, "defis": [{"q": "« Je suis fatigué », dit Hugo. → Hugo dit…", "a": "qu'il est fatigué.", "w": ["qu'il était fatigué.", "que je suis fatigué."], "why": "Verbe introducteur au présent : le temps ne change pas ; je → il."}, {"q": "« J'ai faim », a dit Nadia. → Nadia a dit…", "a": "qu'elle avait faim.", "w": ["qu'elle a faim.", "que j'ai faim."], "why": "Introducteur au passé : présent → imparfait ; je → elle."}, {"q": "« Viens-tu ? » demande-t-il. → Il demande…", "a": "si je viens.", "w": ["si viens-je.", "viens-tu."], "why": "Question fermée → « si », sans inversion."}, {"q": "« Nous partirons demain », annonça-t-elle. → Elle annonça qu'ils…", "a": "partiraient le lendemain.", "w": ["partiront demain.", "partirons demain."], "why": "Futur → conditionnel ; demain → le lendemain."}, {"q": "Quelle phrase est au discours indirect ?", "a": "Il affirme qu'il n'a rien vu.", "w": ["Il affirme : « Je n'ai rien vu. »", "« Je n'ai rien vu », affirme-t-il."], "why": "Paroles intégrées dans une subordonnée."}, {"q": "« Que veux-tu ? » → Il me demande…", "a": "ce que je veux.", "w": ["qu'est-ce que je veux.", "que veux-je."], "why": "« Que… ? » devient « ce que » au discours indirect."}], "terrain": [{"t": "Il m'a demandé {où j'allais ?|où j'allais.}", "why": "Au discours indirect, pas de point d'interrogation."}, {"t": "Elle a dit {« qu'elle était fatiguée »|qu'elle était fatiguée}.", "why": "Au discours indirect, pas de guillemets."}], "open": false}, {"num": 35, "id": "INT", "fam": "SYN", "title": "L'interrogation", "lv": [4, 3], "affaire": "L'affaire des questions cachées", "q": "Pourquoi certaines phrases avec « où » ou « si » n'ont-elles pas de point d'interrogation ?", "groups": ["interrogation directe", "interrogation indirecte"], "corpus": [{"t": "[Où vas-tu ?]", "g": 0}, {"t": "[Je me demande où tu vas.]", "g": 1}, {"t": "[Est-ce que tu viens ?]", "g": 0}, {"t": "[Dis-moi si tu viens.]", "g": 1}, {"t": "[Que cherches-tu ?]", "g": 0}, {"t": "[Je ne sais pas ce que tu cherches.]", "g": 1}], "hyps": [{"t": "L'interrogation directe se termine par « ? » ; l'indirecte est une subordonnée, sans « ? », sans inversion et sans « est-ce que ».", "ok": true, "r": ""}, {"t": "Toute phrase qui contient un mot interrogatif finit par « ? ».", "ok": false, "r": "Contre-exemple : « Je me demande où tu vas. » — « où » est là, mais la phrase finit par un point."}, {"t": "L'interrogation indirecte garde « est-ce que ».", "ok": false, "r": "Contre-exemple : « Dis-moi si tu viens » : « est-ce que » devient « si »."}], "rule": "Interrogation directe : point d'interrogation, et trois tournures (intonation : Tu viens ? ; est-ce que : Est-ce que tu viens ? ; inversion du sujet : Viens-tu ?, la plus soutenue). Interrogation indirecte : subordonnée complément d'un verbe (se demander, savoir, dire…), introduite par si, où, quand, ce que, ce qui, qui… ; pas d'inversion, pas de « est-ce que », pas de point d'interrogation (sauf si la principale est elle-même une question).", "tool": "transformer", "toolUse": "Pour l'écrit soutenu, passe de « est-ce que » à l'inversion : « Est-ce que tu viens ? » → « Viens-tu ? » ; avec un nom sujet : « Le témoin ment-il ? ».", "ex": "Le suspect avoue-t-il ? Je me demande ce qu'il cache.", "piege": "On ajoute -t- entre un verbe terminé par une voyelle et il, elle, on : « Parle-t-il ? A-t-elle vu ? ».", "note": null, "defis": [{"q": "Quelle phrase est une interrogation indirecte correcte ?", "a": "Je me demande pourquoi il ment.", "w": ["Je me demande pourquoi ment-il.", "Je me demande pourquoi est-ce qu'il ment."], "why": "Pas d'inversion ni de « est-ce que » dans l'indirecte."}, {"q": "Forme soutenue de « Tu as vu le voleur ? » :", "a": "As-tu vu le voleur ?", "w": ["As-tu vu le voleur.", "Tu as-tu vu le voleur ?"], "why": "Inversion du sujet + point d'interrogation."}, {"q": "« ___ elle compris ? »", "a": "A-t-", "w": ["A-", "À-t-"], "why": "-t- entre deux voyelles : « A-t-elle compris ? »"}, {"q": "« Je ne sais pas ___ se passe. »", "a": "ce qui", "w": ["qu'est-ce qui", "qu'est-ce que"], "why": "À l'indirect, « qu'est-ce qui » devient « ce qui »."}, {"q": "Quelle phrase doit finir par « ? » ?", "a": "Sais-tu où il est", "w": ["Je sais où il est", "Dis-moi où il est"], "why": "La principale est une question directe."}, {"q": "« Le témoin ___ ? » (mentir, avec inversion)", "a": "ment-il", "w": ["ment-t-il", "mens-il"], "why": "Nom sujet repris par « il » ; « ment » finit déjà par t."}], "terrain": [{"t": "Je me demande {qu'est-ce qu'il|ce qu'il} veut.", "why": "À l'interrogation indirecte : « ce que »."}, {"t": "{Pourquoi tu pars|Pourquoi pars-tu/Pourquoi est-ce que tu pars} ? demanda-t-elle.", "why": "À l'écrit soutenu, on fait l'inversion : « Pourquoi pars-tu ? »."}], "open": false}, {"num": 36, "id": "REP", "fam": "SYN", "title": "Reprises et pronoms ambigus", "lv": [5, 4, 3], "affaire": "L'affaire des pronoms trompeurs", "q": "Quand un pronom devient-il un piège pour le lecteur ?", "groups": ["reprise claire", "reprise ambiguë"], "corpus": [{"t": "[Lina prend son livre. Elle le lit.]", "g": 0}, {"t": "[Paul a vu Marc : il était furieux.]", "g": 1}, {"t": "[Le chat poursuit la souris ; celle-ci s'enfuit.]", "g": 0}, {"t": "[Hugo parle à Sacha de son carnet.]", "g": 1}, {"t": "[La lettre est déchirée ; Margot la recolle.]", "g": 0}, {"t": "[Nadia et Margot cherchent ; elle trouve.]", "g": 1}], "hyps": [{"t": "Une reprise est claire quand un seul antécédent possible correspond au pronom (genre, nombre, sens) ; sinon on reprend par un nom ou par « celui-ci, celle-ci ».", "ok": true, "r": ""}, {"t": "Un pronom reprend toujours le nom le plus proche.", "ok": false, "r": "Contre-exemple : « Lina prend son livre. Elle le lit. » — « elle » reprend Lina, pas le livre."}, {"t": "Il vaut mieux éviter les pronoms et répéter les noms.", "ok": false, "r": "Contre-exemple : « Lina prend son livre. Lina lit son livre. » est correct mais lourd : le pronom est utile quand il est clair."}], "rule": "Pour éviter les répétitions, on reprend un mot par un pronom (il, elle, le, lui, celui-ci…) ou par un autre groupe nominal (le voleur → cet homme → le suspect). La reprise doit renvoyer sans hésitation à un seul antécédent. En cas d'ambiguïté (deux personnages du même genre), on utilise le nom, « celui-ci, celle-ci » (le dernier nommé), ou on reformule.", "tool": "remplacer", "toolUse": "Remplace le pronom par chaque antécédent possible : si plusieurs fonctionnent, la phrase est ambiguë.", "ex": "Hugo croisa Sacha ; ce dernier semblait pressé.", "piege": "« son, sa, ses » peuvent aussi être ambigus : « le carnet de Sacha » lève le doute.", "note": null, "defis": [{"q": "Quelle phrase est sans ambiguïté ?", "a": "Paul a vu Marc ; Marc était furieux.", "w": ["Paul a vu Marc ; il était furieux.", "Il a vu Marc ; il était furieux."], "why": "Le nom répété lève le doute."}, {"q": "« Margot rencontre Nadia ; celle-ci sourit. » Qui sourit ?", "a": "Nadia", "w": ["Margot", "on ne peut pas savoir"], "why": "« celle-ci » reprend le dernier nom cité."}, {"q": "Quelle reprise nominale convient pour « le voleur » ?", "a": "le malfaiteur", "w": ["la victime", "le témoin"], "why": "Synonyme qui désigne la même personne."}, {"q": "« La clé ouvre le coffre ; elle est rouillée. » « elle » reprend :", "a": "la clé", "w": ["le coffre", "on ne peut pas savoir"], "why": "Seul « la clé » est féminin."}, {"q": "Corrige l'ambiguïté : « Hugo dit à Sacha qu'il a gagné. »", "a": "Hugo dit à Sacha : « Tu as gagné. »", "w": ["Hugo dit à Sacha qu'il a gagné lui.", "Il dit à Sacha qu'il a gagné."], "why": "Le discours direct précise qui a gagné."}, {"q": "Quelle phrase évite une répétition sans ambiguïté ?", "a": "Le manoir est vieux ; cette bâtisse tombe en ruine.", "w": ["Le manoir est vieux ; le manoir tombe en ruine.", "Le manoir est vieux ; elle tombe en ruine."], "why": "Reprise nominale claire, même référent."}], "terrain": [{"t": "Nadia a appelé Margot : {elle|Margot/celle-ci/Nadia} était inquiète.", "why": "« elle » pourrait désigner Nadia ou Margot : on reprend par le nom (ou « celle-ci »)."}, {"t": "Le chat a griffé le chien, puis {il|le chat/le chien/celui-ci} s'est enfui.", "why": "« il » peut désigner le chat ou le chien : on précise."}], "open": true}, {"num": 37, "id": "CONN", "fam": "SYN", "title": "Connecteurs logiques", "lv": [5, 4, 3], "affaire": "L'affaire des connecteurs", "q": "Les petits mots qui relient les idées sont-ils interchangeables ?", "groups": ["addition / suite", "opposition", "cause", "conséquence"], "corpus": [{"t": "Il est courageux ; [de plus], il est malin.", "g": 0}, {"t": "Il pleut ; [pourtant], nous sortons.", "g": 1}, {"t": "Je reste, [car] je suis malade.", "g": 2}, {"t": "Il a menti ; [donc] il est suspect.", "g": 3}, {"t": "[Ensuite], nous fouillerons la cave.", "g": 0}, {"t": "Elle a peur ; [cependant], elle avance.", "g": 1}, {"t": "Il a été arrêté, [car] on l'a reconnu.", "g": 2}, {"t": "Le pont est coupé ; [par conséquent], nous attendrons.", "g": 3}], "hyps": [{"t": "Chaque connecteur exprime un rapport logique précis ; en changer modifie le sens du texte.", "ok": true, "r": ""}, {"t": "Les connecteurs sont interchangeables : ils servent juste à relier.", "ok": false, "r": "Contre-exemple : « Il pleut ; donc nous sortons » n'a pas le même sens que « Il pleut ; pourtant nous sortons »."}, {"t": "« car » et « donc » expriment la même idée.", "ok": false, "r": "Contre-exemple : « Je reste car je suis malade » (cause) / « Je suis malade donc je reste » (conséquence) : l'ordre logique est inversé."}], "rule": "Les connecteurs logiques (conjonctions, adverbes, locutions) organisent le texte et précisent les relations entre les idées : addition (et, de plus, en outre), succession (d'abord, ensuite, enfin), opposition (mais, pourtant, cependant, en revanche), cause (car, en effet), conséquence (donc, ainsi, par conséquent), illustration (par exemple). Bien choisis, ils rendent un raisonnement clair.", "tool": "remplacer", "toolUse": "Remplace le connecteur par un autre de la même famille (pourtant → cependant) : si le sens reste le même, il est bien choisi.", "ex": "D'abord, il observa ; ensuite, il nota. Pourtant, rien ne semblait anormal ; il revint donc le lendemain.", "piege": "« car » ne s'emploie pas en tête de phrase après un point : on écrit plutôt « En effet, … ».", "note": null, "defis": [{"q": "Il a révisé ; ___, il a réussi.", "a": "par conséquent", "w": ["pourtant", "car"], "why": "Résultat logique : conséquence."}, {"q": "Il a révisé ; ___, il a échoué.", "a": "pourtant", "w": ["donc", "ainsi"], "why": "Résultat inattendu : opposition."}, {"q": "Il a échoué, ___ il n'avait pas révisé.", "a": "car", "w": ["donc", "cependant"], "why": "Explication : cause."}, {"q": "Quel connecteur marque la succession ?", "a": "ensuite", "w": ["en revanche", "car"], "why": "Il indique l'étape suivante."}, {"q": "« En revanche » exprime :", "a": "une opposition", "w": ["une cause", "une addition"], "why": "Il oppose deux idées."}, {"q": "Quel connecteur introduit un exemple ?", "a": "par exemple", "w": ["en effet", "donc"], "why": "Illustration."}], "terrain": [{"t": "Il faisait beau, {donc|pourtant/mais/cependant} il resta enfermé toute la journée.", "why": "Le résultat est inattendu : opposition (« pourtant », « mais »)."}, {"t": "J'ai pris mon parapluie {mais|car/parce qu'} il pleuvait.", "why": "Il s'agit d'une explication : cause (« car »)."}], "open": false}, {"num": 38, "id": "MAJ", "fam": "PONC", "title": "Point et majuscule", "lv": [6], "affaire": "L'affaire des majuscules", "q": "Quels mots méritent une majuscule ?", "groups": ["majuscule", "minuscule"], "corpus": [{"t": "[Hier], nous sommes partis.", "g": 0}, {"t": "Nous avons visité [Lyon].", "g": 0}, {"t": "Il aime les [chats].", "g": 1}, {"t": "[Margot] arrive.", "g": 0}, {"t": "Je parle [anglais].", "g": 1}, {"t": "Les [Anglais] boivent du thé.", "g": 0}], "hyps": [{"t": "On met une majuscule au début d'une phrase et aux noms propres (personnes, villes, pays, habitants) ; les noms communs, y compris les langues, prennent une minuscule.", "ok": true, "r": ""}, {"t": "Les mots importants prennent une majuscule.", "ok": false, "r": "Contre-exemple : « Je parle anglais » — mot important, pourtant minuscule (nom de langue)."}, {"t": "Les noms de pays et de leurs habitants s'écrivent comme les adjectifs.", "ok": false, "r": "Contre-exemple : « les Anglais » (habitants, majuscule) ≠ « un livre anglais » (adjectif, minuscule)."}], "rule": "Une phrase commence par une majuscule et se termine par un point (ou ?, !, …). Les noms propres prennent une majuscule : prénoms, noms de famille, villes, pays, fleuves, habitants (les Français), institutions. Les adjectifs (un musée français), les noms de langues (le français), de jours et de mois (lundi, mars) prennent une minuscule.", "tool": "questionner", "toolUse": "Demande-toi : est-ce un nom unique qui désigne une personne, un lieu ou un peuple ? Si oui, majuscule.", "ex": "Lundi, Margot et sa cousine anglaise ont visité Londres avec des Écossais.", "piege": "Les majuscules gardent leurs accents : « À demain », « État », « Écosse ».", "note": null, "defis": [{"q": "Quelle phrase est correcte ?", "a": "Nous partons en Espagne en juillet.", "w": ["Nous partons en espagne en Juillet.", "nous partons en Espagne en juillet."], "why": "Pays : majuscule ; mois : minuscule."}, {"q": "« Les ___ aiment le football. »", "a": "Brésiliens", "w": ["brésiliens"], "why": "Habitants : majuscule."}, {"q": "« Elle apprend l'___. »", "a": "italien", "w": ["Italien"], "why": "Langue : minuscule."}, {"q": "Quelle phrase commence correctement ?", "a": "À minuit, tout était calme.", "w": ["à minuit, tout était calme.", "A minuit, Tout était calme."], "why": "Majuscule accentuée en début de phrase."}, {"q": "« un tableau ___ »", "a": "français", "w": ["Français"], "why": "Adjectif : minuscule."}, {"q": "Combien de majuscules dans « hier, hugo a vu la seine à paris » une fois corrigée ?", "a": "quatre", "w": ["deux", "trois"], "why": "Hier, Hugo, Seine, Paris."}], "terrain": [{"t": "Nous avons visité {londres|Londres} en mai.", "why": "Nom de ville : majuscule."}, {"t": "La tour Eiffel est à Paris. {elle|Elle} mesure plus de trois cents mètres.", "why": "Début de phrase : majuscule."}], "open": false}, {"num": 39, "id": "VIRG", "fam": "PONC", "title": "La virgule", "lv": [6, 5, 4], "affaire": "L'affaire de la virgule", "q": "Où la virgule est-elle utile, et où est-elle interdite ?", "groups": ["virgule(s) utile(s)", "aucune virgule"], "corpus": [{"t": "[Dans la cour, les élèves discutent.]", "g": 0}, {"t": "[Les élèves discutent dans la cour.]", "g": 1}, {"t": "[J'ai acheté du pain, des œufs et du lait.]", "g": 0}, {"t": "[Hugo, mon cousin, est détective.]", "g": 0}, {"t": "[Le gardien ferme la porte.]", "g": 1}, {"t": "[Le témoin qui ment sera puni.]", "g": 1}], "hyps": [{"t": "La virgule sépare les éléments d'une énumération, isole un complément placé en tête de phrase ou une apposition ; elle ne sépare pas le sujet du verbe, ni le verbe de son complément essentiel.", "ok": true, "r": ""}, {"t": "On met une virgule quand la phrase est longue, pour respirer.", "ok": false, "r": "Contre-exemple : « Le témoin qui ment sera puni » : pas de virgule entre le sujet et le verbe, même long."}, {"t": "On met toujours une virgule devant « et ».", "ok": false, "r": "Contre-exemple : « du pain, des œufs et du lait » — pas de virgule devant le dernier « et »."}], "rule": "La virgule marque une pause courte et organise la phrase : elle sépare les éléments d'une énumération (sauf devant le dernier « et »), isole un complément circonstanciel placé en tête, encadre une apposition ou une incise, sépare des propositions juxtaposées. On ne met pas de virgule entre le sujet et le verbe, ni entre le verbe et son COD ou son COI.", "tool": "deplacer", "toolUse": "Déplace le groupe : en tête de phrase (« Dans la cour, les élèves… »), virgule ; à sa place habituelle (« …discutent dans la cour »), souvent pas de virgule.", "ex": "Ce soir-là, Hugo, inquiet, prit sa lampe, sa loupe et son carnet.", "piege": "Pas de virgule devant « que » quand il introduit une complétive : « Il dit qu'il viendra ».", "note": null, "defis": [{"q": "Où faut-il une virgule ? « Le soir venu les loups hurlent. »", "a": "Le soir venu, les loups hurlent.", "w": ["Le soir, venu les loups hurlent.", "Le soir venu les loups, hurlent."], "why": "Complément en tête de phrase."}, {"q": "Quelle phrase est bien ponctuée ?", "a": "Il prit sa loupe, son carnet et sa lampe.", "w": ["Il prit, sa loupe son carnet et sa lampe.", "Il prit sa loupe, son carnet, et, sa lampe."], "why": "Énumération sans virgule devant « et »."}, {"q": "Quelle phrase est bien ponctuée ?", "a": "Les enfants du village jouent.", "w": ["Les enfants du village, jouent.", "Les enfants, du village jouent."], "why": "Pas de virgule entre le sujet et le verbe."}, {"q": "« Margot ___ ma voisine ___ est partie. »", "a": "virgule, virgule", "w": ["rien, rien", "virgule, rien"], "why": "Apposition encadrée par deux virgules."}, {"q": "Quelle phrase est bien ponctuée ?", "a": "Il sait qu'elle ment.", "w": ["Il sait, qu'elle ment.", "Il, sait qu'elle ment."], "why": "Pas de virgule devant « que » complétive."}, {"q": "Quelle phrase est bien ponctuée ?", "a": "Il entra, regarda, puis repartit.", "w": ["Il entra regarda, puis repartit.", "Il, entra, regarda puis repartit."], "why": "Propositions juxtaposées séparées par des virgules."}], "terrain": [{"t": "{Hier soir|Hier soir,} nous avons entendu un cri.", "why": "Complément de temps en tête de phrase : virgule."}, {"t": "{Le gardien du manoir,|Le gardien du manoir} ferme la grille.", "why": "Pas de virgule entre le sujet et le verbe."}], "open": false}, {"num": 40, "id": "DIAL", "fam": "PONC", "title": "Ponctuation du dialogue", "lv": [5, 4], "affaire": "L'affaire du dialogue", "q": "Quels signes faut-il pour faire parler un personnage ?", "groups": ["bien ponctué", "mal ponctué"], "corpus": [{"t": "[« Viens ici ! » dit-elle.]", "g": 0}, {"t": "[« Viens ici ! » Dit-elle.]", "g": 1}, {"t": "[Il demanda : « Qui est là ? »]", "g": 0}, {"t": "[Il demanda « Qui est là ? »]", "g": 1}, {"t": "[« Je ne sais pas, répondit Hugo, mais je vais chercher. »]", "g": 0}, {"t": "[« Je ne sais pas » répondit Hugo.]", "g": 1}], "hyps": [{"t": "Les paroles sont annoncées par deux-points et encadrées de guillemets ; l'incise (dit-il) est séparée par une virgule et commence par une minuscule ; dans un échange, chaque réplique commence par un tiret.", "ok": true, "r": ""}, {"t": "Après des guillemets, on met toujours une majuscule.", "ok": false, "r": "Contre-exemple : « Viens ici ! » dit-elle. — l'incise garde une minuscule."}, {"t": "Les deux-points sont facultatifs avant les guillemets.", "ok": false, "r": "Contre-exemple : « Il demanda « Qui est là ? » » est fautif : le verbe de parole annonce les paroles par deux-points."}], "rule": "Discours direct : le verbe de parole annonce les paroles par deux-points ; les paroles sont entre guillemets (« … ») et commencent par une majuscule. Dans un dialogue, chaque changement d'interlocuteur est marqué par un tiret en début de ligne. L'incise (dit-il, répondit Hugo) a un sujet inversé, commence par une minuscule et est séparée par une virgule (ou suit directement un point d'interrogation ou d'exclamation).", "tool": "transformer", "toolUse": "Repère qui parle et où commence chaque réplique ; vérifie : deux-points, guillemets, tiret à chaque nouvelle réplique, incise en minuscule.", "ex": "Margot murmura : « Tu entends ? » « Oui, répondit Hugo, quelqu'un marche là-haut. »", "piege": "Dans l'incise, -t- s'ajoute entre deux voyelles : « dit-il », mais « demanda-t-il ».", "note": null, "defis": [{"q": "Quelle phrase est bien ponctuée ?", "a": "Il cria : « Attention ! »", "w": ["Il cria « Attention ! »", "Il cria : Attention !"], "why": "Deux-points + guillemets."}, {"q": "Quelle incise est correcte ?", "a": "« J'arrive », répondit-elle.", "w": ["« J'arrive », elle répondit.", "« J'arrive. » Répondit-elle."], "why": "Inversion du sujet, minuscule, virgule."}, {"q": "« Où vas-tu ? » ___ Margot.", "a": "demanda", "w": ["Demanda", ", demanda"], "why": "Après « ? », pas de virgule, et une minuscule."}, {"q": "Dans un dialogue, un changement d'interlocuteur se marque par :", "a": "un tiret en début de ligne", "w": ["une majuscule seulement", "un point-virgule"], "why": "Chaque nouvelle réplique commence par un tiret."}, {"q": "« Vient-il ? » ___elle.", "a": "demanda-t-", "w": ["demanda-", "demandat-"], "why": "-t- entre deux voyelles : « demanda-t-elle »."}, {"q": "Quels guillemets utilise-t-on en français ?", "a": "« »", "w": ["\" \"", "< >"], "why": "Les guillemets français sont « et »."}], "terrain": [{"t": "« Je reviens », {Dit-il|dit-il} en partant.", "why": "L'incise commence par une minuscule."}, {"t": "Elle demanda {« Qui est là ? »|: « Qui est là ? »}", "why": "Le verbe de parole annonce les paroles par deux-points."}], "open": false}, {"num": 41, "id": "SIGN", "fam": "PONC", "title": "? ! ; :", "lv": [5, 4, 3], "affaire": "L'affaire des signes mystérieux", "q": "Quel est le rôle de chaque signe de ponctuation forte ?", "groups": ["?", "!", ";", ":"], "corpus": [{"t": "[Où est la clé ?]", "g": 0}, {"t": "[Quelle peur !]", "g": 1}, {"t": "[Il pleut ; nous restons.]", "g": 2}, {"t": "[Il avait tout : une loupe, une lampe, un carnet.]", "g": 3}, {"t": "[Viendra-t-il ?]", "g": 0}, {"t": "[Comme c'est étrange !]", "g": 1}, {"t": "[Le jour baisse ; la nuit approche.]", "g": 2}, {"t": "[Une seule chose compte : la vérité.]", "g": 3}], "hyps": [{"t": "? pour une question directe, ! pour une exclamation ou un ordre vif, ; pour séparer deux propositions liées par le sens, : pour annoncer une explication, une énumération ou des paroles.", "ok": true, "r": ""}, {"t": "Le point-virgule s'emploie entre les éléments de n'importe quelle liste.", "ok": false, "r": "Contre-exemple : dans « du pain, des œufs et du lait », on met des virgules : le point-virgule sépare surtout des propositions."}, {"t": "Le deux-points sert uniquement avant des paroles.", "ok": false, "r": "Contre-exemple : « Une seule chose compte : la vérité » — il annonce une explication."}], "rule": "Le point d'interrogation termine une question directe ; le point d'exclamation, une exclamation, un ordre vif ou une interjection. Le point-virgule sépare deux propositions liées par le sens, plus fortement qu'une virgule et moins qu'un point. Le deux-points annonce une explication, une conséquence, une énumération ou des paroles rapportées. En français, on met une espace avant ; : ! ?", "tool": "transformer", "toolUse": "Remplace le signe par des mots : « : » = « c'est-à-dire » ou « parce que » ; « ; » = un « et » ou un « mais » sous-entendu.", "ex": "Que faire ? Il n'y avait qu'une solution : fouiller la cave ; personne n'osait.", "piege": "L'interrogation indirecte ne prend pas de point d'interrogation (voir le code 35).", "note": null, "defis": [{"q": "« Quel désordre ___ »", "a": "!", "w": ["?", ";"], "why": "Exclamation."}, {"q": "« Il n'avait qu'un but ___ trouver le coupable. »", "a": ":", "w": ["!", ";"], "why": "Le deux-points annonce une explication."}, {"q": "« La nuit tombait ___ les rues se vidaient. »", "a": ";", "w": ["?", ":"], "why": "Deux propositions liées par le sens."}, {"q": "« As-tu vu ce film ___ »", "a": "?", "w": ["!", "."], "why": "Question directe."}, {"q": "« Je me demande s'il viendra ___ »", "a": ".", "w": ["?", "!"], "why": "Interrogation indirecte : point final."}, {"q": "En français, devant « ? », on met :", "a": "une espace", "w": ["rien", "une virgule"], "why": "Espace avant ; : ! ?"}], "terrain": [{"t": "Je me demande s'il {viendra ?|viendra.}", "why": "Interrogation indirecte : pas de point d'interrogation."}, {"t": "Il avait tout {prévu,|prévu :} une corde, une lampe et une carte.", "why": "Le deux-points annonce une énumération."}], "open": false}, {"num": 42, "id": "PREC", "fam": "VOC", "title": "Mot imprécis, répétition", "lv": [6, 5, 4, 3], "affaire": "L'affaire des mots passe-partout", "q": "Qu'est-ce qui rend un verbe plus parlant qu'un autre ?", "groups": ["verbe passe-partout", "verbe précis"], "corpus": [{"t": "Il [fait] un dessin.", "g": 0}, {"t": "Il [trace] un plan.", "g": 1}, {"t": "Elle [dit] un secret.", "g": 0}, {"t": "Elle [murmure] un secret.", "g": 1}, {"t": "[Il y a] une ombre au fond.", "g": 0}, {"t": "Une ombre [se dresse] au fond.", "g": 1}], "hyps": [{"t": "Les verbes passe-partout (faire, dire, avoir, mettre, il y a) peuvent être remplacés par un verbe précis qui dit exactement l'action et évite les répétitions.", "ok": true, "r": ""}, {"t": "Les verbes courts sont des fautes.", "ok": false, "r": "Contre-exemple : « Il trace un plan » : verbe court mais précis. Ce n'est pas la longueur qui compte."}, {"t": "« Il y a » est interdit à l'écrit.", "ok": false, "r": "Contre-exemple : « Il y a » est correct ; mais on peut souvent dire mieux : « Une ombre se dresse »."}], "rule": "Un mot précis rend l'écrit plus vivant et plus clair. On remplace les verbes passe-partout (faire, dire, avoir, mettre, voir, il y a) par des verbes qui précisent l'action (dire → murmurer, affirmer, avouer ; faire un gâteau → préparer). On varie aussi les mots pour éviter les répétitions, avec des synonymes : ils ont un sens proche, mais pas toujours identique (content, heureux, ravi).", "tool": "remplacer", "toolUse": "Pour chaque « faire, dire, avoir, mettre, il y a », cherche un verbe plus précis qui convient au contexte.", "ex": "Au lieu de « Il dit qu'il a fait le gâteau », écris : « Il avoue qu'il a préparé le gâteau. »", "piege": "Un synonyme n'est pas toujours interchangeable : « un grand homme » ≠ « un homme grand ».", "note": null, "defis": [{"q": "Remplace « fait » : « Il fait une maquette. »", "a": "construit", "w": ["met", "dit"], "why": "Construire une maquette : précis."}, {"q": "Remplace « dit » : « Elle dit son secret à voix basse. »", "a": "chuchote", "w": ["crie", "fait"], "why": "Chuchoter = parler très bas."}, {"q": "Remplace « met » : « Il met son manteau. »", "a": "enfile", "w": ["fait", "a"], "why": "Enfiler un vêtement."}, {"q": "Remplace « il y a » : « Il y a un parfum de rose dans la pièce. »", "a": "Un parfum de rose flotte dans la pièce.", "w": ["Il y a un parfum de rose.", "Un parfum de rose fait dans la pièce."], "why": "Le verbe « flotter » est précis."}, {"q": "Synonyme de « peur » le plus intense :", "a": "terreur", "w": ["inquiétude", "appréhension"], "why": "La terreur est une peur extrême."}, {"q": "Remplace « a » : « Il a une maladie rare. »", "a": "souffre d'", "w": ["fait", "met"], "why": "Souffrir d'une maladie."}], "terrain": [{"t": "Il {fait|prépare/confectionne/cuisine} un gâteau pour l'anniversaire de Nadia.", "why": "« faire » est passe-partout : « préparer » est plus précis."}, {"t": "Le témoin {dit|avoue/reconnaît/admet} enfin qu'il a menti.", "why": "« avouer » précise qu'il reconnaît une faute."}], "open": true}, {"num": 43, "id": "REG", "fam": "VOC", "title": "Registre de langue", "lv": [5, 4, 3], "affaire": "L'affaire des registres", "q": "Pourquoi certains mots sont-ils corrects mais pas à leur place dans une rédaction ?", "groups": ["familier", "courant", "soutenu"], "corpus": [{"t": "Il a [paumé] ses clés.", "g": 0}, {"t": "Il a [perdu] ses clés.", "g": 1}, {"t": "Il a [égaré] ses clés.", "g": 2}, {"t": "Ça me [saoule].", "g": 0}, {"t": "Cela m'[ennuie].", "g": 1}, {"t": "Cela m'[importune].", "g": 2}], "hyps": [{"t": "Le registre dépend de la situation : familier entre proches, courant dans la plupart des situations, soutenu dans les écrits littéraires ou très formels ; en rédaction, on évite le familier.", "ok": true, "r": ""}, {"t": "Le registre familier, ce sont des fautes.", "ok": false, "r": "Contre-exemple : « paumer » est un vrai mot, compris de tous, mais il ne convient pas à une rédaction."}, {"t": "Le registre soutenu, ce sont des mots longs.", "ok": false, "r": "Contre-exemple : « égaré » n'est pas plus long que « perdu », mais il est soutenu."}], "rule": "Les registres (ou niveaux) de langue : familier (oral entre proches : un mec, paumer, ça), courant (neutre : un homme, perdre, cela), soutenu (écrit littéraire ou formel : égarer, importuner). On adapte le registre à la situation de communication et au genre du texte. Dans une rédaction, on emploie le registre courant, le soutenu pour certains effets, et le familier seulement dans les paroles d'un personnage.", "tool": "remplacer", "toolUse": "Imagine que tu parles à un inconnu très poli : quel mot choisirais-tu ?", "ex": "Familier : « J'ai la flemme. » Courant : « Je n'ai pas envie. » Soutenu : « Je n'en ai nul désir. »", "piege": "Dans un dialogue, un personnage peut parler de façon familière : c'est un choix d'écriture.", "note": null, "defis": [{"q": "Mot courant pour « bouquin » :", "a": "livre", "w": ["ouvrage", "bouquinerie"], "why": "« bouquin » est familier ; « livre » est courant."}, {"q": "Mot soutenu pour « avoir peur » :", "a": "craindre", "w": ["flipper", "avoir la trouille"], "why": "« craindre » appartient au registre soutenu."}, {"q": "Dans une rédaction, préfère :", "a": "Cette idée est peu convaincante.", "w": ["C'est trop nul.", "C'est naze."], "why": "Registre courant adapté à l'écrit scolaire."}, {"q": "« Bagnole » appartient au registre :", "a": "familier", "w": ["courant", "soutenu"], "why": "Courant : voiture ; soutenu : automobile."}, {"q": "Quel mot est soutenu ?", "a": "demeure", "w": ["baraque", "maison"], "why": "« demeure » est soutenu ; « maison » courant ; « baraque » familier."}, {"q": "« Ça m'énerve » en registre courant :", "a": "Cela m'agace.", "w": ["Ça me gonfle.", "Ça me saoule."], "why": "« Cela » + verbe neutre."}], "terrain": [{"t": "Le héros avait {la trouille|peur/très peur} de la forêt.", "why": "« la trouille » est familier : dans un récit, « peur »."}, {"t": "Elle {a paumé|a perdu/a égaré} sa clé dans le parc.", "why": "« paumer » est familier : « perdre » ou « égarer »."}], "open": true}, {"num": 44, "id": "FORM", "fam": "VOC", "title": "Formation des mots", "lv": [6, 5], "affaire": "L'affaire des préfixes et suffixes", "q": "Comment fabrique-t-on de nouveaux mots à partir d'un mot ?", "groups": ["préfixe (avant le radical)", "suffixe (après le radical)"], "corpus": [{"t": "[im]possible", "g": 0}, {"t": "lent[ement]", "g": 1}, {"t": "[re]faire", "g": 0}, {"t": "chant[eur]", "g": 1}, {"t": "[dé]coller", "g": 0}, {"t": "jardin[age]", "g": 1}], "hyps": [{"t": "On ajoute au radical un préfixe (qui modifie le sens : im-, re-, dé-) ou un suffixe (qui change souvent la classe : -ment pour un adverbe, -eur pour un nom).", "ok": true, "r": ""}, {"t": "Préfixes et suffixes changent tous les deux la classe du mot.", "ok": false, "r": "Contre-exemple : « possible » et « impossible » sont tous deux des adjectifs : le préfixe ne change pas la classe."}, {"t": "Tous les mots qui commencent par « re- » ont un préfixe.", "ok": false, "r": "Contre-exemple : « renard », « reine » : si on enlève « re- », il ne reste aucun mot de la même famille."}], "rule": "Un mot dérivé est formé d'un radical auquel on ajoute un préfixe (avant) et/ou un suffixe (après). Le préfixe modifie le sens (in-, im- = contraire ; re- = répétition ; dé- = action inverse ; pré- = avant). Le suffixe change souvent la classe grammaticale (-ment : adverbe ; -age, -tion, -eur : nom ; -able : adjectif). Les mots d'une même famille partagent le même radical ; beaucoup viennent du latin ou du grec (chrono = temps, graphe = écrire).", "tool": "famille", "toolUse": "Retire le préfixe ou le suffixe : s'il reste un mot de la même famille, tu as trouvé le radical.", "ex": "lire → relire, lecteur, lisible, illisible.", "piege": "« in- » devient « im- » devant m, b, p (impossible), « il- » devant l (illisible), « ir- » devant r (irréel).", "note": null, "defis": [{"q": "Quel est le contraire de « lisible » ?", "a": "illisible", "w": ["inlisible", "délisible"], "why": "in- devient il- devant l."}, {"q": "Dans « déchiffrer », « dé- » est :", "a": "un préfixe", "w": ["un suffixe", "le radical"], "why": "Placé avant le radical « chiffre »."}, {"q": "Quel suffixe forme un adverbe ?", "a": "-ment", "w": ["-age", "-eur"], "why": "rapide → rapidement."}, {"q": "Quel mot n'est pas de la même famille que « terre » ?", "a": "terrible", "w": ["terrain", "enterrer"], "why": "« terrible » est de la famille de « terreur »."}, {"q": "« Chronologie » contient le radical grec « chrono », qui signifie :", "a": "temps", "w": ["lumière", "écriture"], "why": "Chrono- = temps."}, {"q": "Le contraire de « réel » est :", "a": "irréel", "w": ["inréel", "déréel"], "why": "in- devient ir- devant r."}], "terrain": [{"t": "Ce message est {inlisible|illisible}.", "why": "Devant l, « in- » devient « il- » : illisible."}, {"t": "C'est une mission {inpossible|impossible}.", "why": "Devant p, « in- » devient « im- »."}], "open": false}, {"num": 45, "id": "SENS", "fam": "VOC", "title": "Sens propre, sens figuré, homonymes", "lv": [5, 4, 3], "affaire": "L'affaire des doubles sens", "q": "Un même mot peut-il avoir plusieurs sens ?", "groups": ["sens propre", "sens figuré"], "corpus": [{"t": "Il a [brisé] la vitre.", "g": 0}, {"t": "Elle a le cœur [brisé].", "g": 1}, {"t": "Le soleil [brûle] la peau.", "g": 0}, {"t": "Il [brûle] d'impatience.", "g": 1}, {"t": "Une [pluie] fine tombe.", "g": 0}, {"t": "Une [pluie] de questions s'abat sur lui.", "g": 1}], "hyps": [{"t": "Le sens propre est le sens premier, concret ; le sens figuré en est une image, souvent abstraite. Le contexte permet de choisir.", "ok": true, "r": ""}, {"t": "Le sens figuré est une faute de vocabulaire.", "ok": false, "r": "Contre-exemple : « Elle a le cœur brisé » est tout à fait correct : c'est une image."}, {"t": "Un mot n'a qu'un seul sens.", "ok": false, "r": "Contre-exemple : « pluie » désigne de l'eau qui tombe, ou une grande quantité (« une pluie de questions ») : c'est la polysémie."}], "rule": "Un mot polysémique a plusieurs sens. Le sens propre est le sens premier, concret (briser une vitre) ; le sens figuré est un sens imagé, souvent abstrait (un cœur brisé). Le contexte indique le sens. À ne pas confondre avec les homonymes : des mots différents qui se prononcent ou s'écrivent pareil (un verre, un ver, vert).", "tool": "remplacer", "toolUse": "Remplace par un synonyme : « brûler d'impatience » → « être très impatient » : le sens est abstrait → figuré.", "ex": "Au sens propre, on dévore un gâteau ; au sens figuré, on dévore un livre.", "piege": "Les expressions figées ont un sens figuré : « avoir le cafard », « tomber des nues ».", "note": null, "defis": [{"q": "« Il a une mémoire d'éléphant » : « éléphant » est employé au sens :", "a": "figuré", "w": ["propre"], "why": "Image : une très bonne mémoire."}, {"q": "« Le chat boit son lait » : « boit » est employé au sens :", "a": "propre", "w": ["figuré"], "why": "Sens concret."}, {"q": "« Il boit les paroles du conteur » signifie :", "a": "il écoute avec passion", "w": ["il a soif", "il répète les paroles"], "why": "Sens figuré de « boire »."}, {"q": "« Ver, verre, vert » sont :", "a": "des homonymes", "w": ["des synonymes", "des antonymes"], "why": "Même prononciation, sens différents."}, {"q": "« Une montagne de devoirs » signifie :", "a": "beaucoup de devoirs", "w": ["des devoirs de géographie", "des devoirs faits en montagne"], "why": "Sens figuré : une grande quantité."}, {"q": "Quel est le sens de « froid » dans « un accueil froid » ?", "a": "peu chaleureux", "w": ["à basse température", "humide"], "why": "Sens figuré."}], "terrain": [{"t": "Il a bu un {vert|verre} d'eau.", "why": "Homonymes : le récipient s'écrit « verre »."}, {"t": "Le pêcheur accroche un {verre|ver} à son hameçon.", "why": "L'animal s'écrit « ver »."}], "open": false}]</script>
<script type="application/json" id="data-missions">[{"id": "orth-a", "fam": "ORTH", "lv": [6, 5], "title": "Le registre du château", "kind": "Page de registre", "guide": "margot", "intro": "Le registre du gardien a été recopié par un apprenti distrait. Si on le rend tel quel au comte, on ne saura jamais ce qui s'est passé la nuit du 3 mars.", "text": "Le soir du 3 mars, le gardien {à|a|1} fermé la grande porte {est|et|2} il est monté {a|à|1} la tour. {Ont|On|3} entendait le vent souffler. Il {c'est|s'est|4} approché de la fenêtre, mais il ne savait pas {ou|où|5} se cachait le chat du château. Il l'a enfin retrouvé, endormi sur {ces|ses|4} propres coussins.", "outro": "Le registre est lisible : le chat n'y était pour rien. Le comte te confie la première lettre du code."}, {"id": "orth-b", "fam": "ORTH", "lv": [4, 3], "title": "Le journal de la comtesse", "kind": "Journal intime", "guide": "nadia", "intro": "Dans le bureau de la comtesse, une page de journal a été retrouvée. Elle parle d'une ombre… mais les fautes rendent le témoignage douteux.", "text": "Mes neveux arrivent demain. Je {leurs|leur|7} ai préparé {leur|leurs|7} chambres au deuxième étage. Je veux tout {vérifié|vérifier|8} avant leur arrivée : {se|ce|6} manoir est si vieux ! Hier soir, une ombre {ce|se|6} déplaçait dans le couloir {étroi|étroit|9}. {Sa|Ça|6} m'a glacé le sang. Vous {pensé|pensez|8} sans doute que je perds la tête…", "outro": "Le témoignage est désormais crédible : l'ombre existait bien. Une piste de plus pour l'équipe."}, {"id": "acc-a", "fam": "ACC", "lv": [6, 5], "title": "La lettre du pont", "kind": "Lettre", "guide": "hugo", "intro": "Les gardes du pont ont envoyé une lettre au QG. Chaque accord oublié brouille le message : qui est passé, et quand ?", "text": "Chers amis, les gardes du pont {surveille|surveillent|10} l'entrée nuit et jour. Hier, deux voyageuses sont {arrivé|arrivées|12} avec des valises {lourde|lourdes|11}. Elles semblaient {fatigué|fatiguées|15}. Le chef des gardes, qui connaît bien les {chevals|chevaux|11}, leur a prêté une monture. Les filles du meunier {est|sont|10} venues les accueillir.", "outro": "Deux voyageuses, une monture prêtée : le pont livre son secret et une nouvelle lettre du code."}, {"id": "acc-b", "fam": "ACC", "lv": [4, 3], "title": "Le rapport de l'inspectrice", "kind": "Rapport de police", "guide": "sacha", "intro": "L'inspectrice a tapé son rapport à toute vitesse. Les participes passés sont en pagaille : impossible de le présenter au juge.", "text": "Les lettres que nous avons {trouvé|trouvées|13} dans le bureau étaient signées. L'inspectrice s'est {lavée|lavé|14} les mains avant de les examiner. Les deux suspects se sont {disputé|disputés|14} devant nous, puis ils se sont {parlés|parlé|14} à voix basse. {Tout|Toutes|16} les preuves étaient là. L'un d'eux portait des chaussures {marrons|marron|16}. Nous les avons {interrogé|interrogés|13} pendant {quatre-vingt|quatre-vingts|16} minutes.", "outro": "Rapport impeccable : le juge peut l'accepter."}, {"id": "conj-a", "fam": "CONJ", "lv": [6, 5], "title": "La légende de la forêt", "kind": "Légende", "guide": "margot", "intro": "Un conteur a écrit la légende de la sorcière de la forêt. Les temps se mélangent comme des feuilles mortes : l'histoire n'a plus de sens.", "text": "Il y a très longtemps, une sorcière vivait au cœur de la forêt. Chaque soir, elle {allumat|allumait|18} un grand feu. Un jour, un jeune garçon {entrait|entra|18} dans sa cabane. « Je te {donnerais|donnerai|19} ce livre demain si tu reviens. {Fermes|Ferme|22} la porte en partant ! » Le garçon {a|est|20} reparti en courant. Aujourd'hui encore, il {répont|répond|17} à ceux qui l'interrogent qu'il n'a jamais revu la sorcière.", "outro": "La légende se lit enfin d'une traite. La forêt t'offre une lettre du code."}, {"id": "conj-b", "fam": "CONJ", "lv": [4, 3], "title": "Les ordres du capitaine", "kind": "Ordre de mission", "guide": "hugo", "intro": "Le capitaine a dicté ses ordres pour l'expédi
