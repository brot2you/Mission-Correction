tion de l'aube. Les modes et les « si » sont faux : l'équipe risque de partir au mauvais moment.", "text": "Il faut que vous {êtes|soyez|21} prêts à l'aube. Je veux que chacun {prend|prenne|21} une lanterne. Si nous {aurions|avions|23} une carte, nous {irons|irions|23} plus vite. Si le brouillard se lève, nous {partirions|partirons|23} tout de suite. Bien que la route {est|soit|21} longue, personne ne fera demi-tour.", "outro": "Les ordres sont clairs : l'expédition peut partir."}, {"id": "gram-a", "fam": "GRAM", "lv": [6, 5], "title": "L'inscription du temple", "kind": "Récit de novice", "guide": "nadia", "intro": "Un novice a raconté la disparition d'une statue. Ses pronoms et ses adverbes trahissent sa précipitation.", "text": "Les prêtres du temple avançaient {lentemment|lentement|24}. Le plus vieux portait une lanterne ; je {lui ai vu|l'ai vu|25} la poser sur l'autel. Il a parlé aux novices et il {les|leur|25} a confié un secret. Ils ont écouté {attentivemment|attentivement|24}. Ils étaient inquiets {à cause qu'|parce qu'|26}une statue avait disparu. Personne {ne lui avait vue|ne l'avait vue|25} sortir.", "outro": "Le récit du novice tient debout. Le temple te remet sa lettre."}, {"id": "gram-b", "fam": "GRAM", "lv": [4, 3], "title": "Le carnet de l'archéologue", "kind": "Carnet de fouilles", "guide": "sacha", "intro": "Le carnet de l'archéologue décrit la salle secrète. Les accords des appositions et des participes passifs sont à vérifier.", "text": "La porte secrète a été {ouvert|ouverte|28} hier par deux archéologues. {Épuisé|Épuisés|27}, ils se sont arrêtés devant une statue. {Malgré qu'|Bien qu'|26}elle soit abîmée, on devine un visage. Les inscriptions ont été {photographié|photographiées|28} une à une. Notre guide, {une femme silencieux|une femme silencieuse|27}, nous a montré la sortie.", "outro": "Le carnet est fiable : la salle secrète est authentifiée."}, {"id": "syn-a", "fam": "SYN", "lv": [6, 5], "title": "Le message des ruines", "kind": "Carte postale", "guide": "hugo", "intro": "Hugo a écrit une carte depuis les ruines… en oubliant que les phrases ont besoin d'être construites.", "text": "Nous sommes entrés dans les ruines{. Parce| parce|29} qu'un orage approchait. Le guide {que|dont|30} je t'ai parlé nous attendait. Il nous a dit : « On {a|n'a|31} jamais trouvé le trésor. » C'est la salle {que|où|30} les rois dormaient. Je {comprends|ne comprends|31} pas pourquoi personne ne l'a fouillée. {Quand la nuit est tombée.|Quand la nuit est tombée,|29} nous sommes ressortis.", "outro": "Les phrases tiennent debout comme des colonnes. Les ruines te livrent une lettre."}, {"id": "syn-b", "fam": "SYN", "lv": [4, 3], "title": "Le testament", "kind": "Testament", "guide": "margot", "intro": "Le vieux comte a rédigé son testament. Si les phrases sont mal construites, ses héritiers pourront le contester.", "text": "Je me demande {qu'est-ce que|ce que|35} mes héritiers feront de ce manoir. Mon neveu m'a dit {« qu'il le vendrait »|qu'il le vendrait|34}. Ma nièce et ma cousine se détestent ; {elle|ma nièce/ma cousine/la première/la seconde/celle-ci|36} refuse de lui parler. Je leur lègue tout {pour qu'ils sont|pour qu'ils soient|33} unis. Le manoir est vieux, {donc|pourtant/mais/cependant|37} il est solide. Je ne sais plus {où est-ce que|où|35} j'ai rangé la clé.", "outro": "Testament inattaquable. Le notaire est satisfait."}, {"id": "ponc-a", "fam": "PONC", "lv": [6, 5], "title": "L'affiche du phare", "kind": "Affiche", "guide": "nadia", "intro": "Le gardien du phare a collé une affiche sur le port. Personne ne la comprend : la ponctuation est en tempête.", "text": "Avis aux habitants. {le phare|Le phare|38} sera fermé du 3 au 10 {Mai|mai|38}. {Le gardien du phare,|Le gardien du phare|39} a besoin d'aide. Apportez {vos lampes vos cordes|vos lampes, vos cordes|39} et vos cartes. Il a demandé {« Qui veut m'aider ? »|: « Qui veut m'aider ? »|40}. {Qui viendra.|Qui viendra ?|41}", "outro": "L'affiche est claire : les volontaires arrivent. Le phare t'éclaire une lettre."}, {"id": "ponc-b", "fam": "PONC", "lv": [4, 3], "title": "L'interrogatoire enregistré", "kind": "Transcription", "guide": "sacha", "intro": "L'interrogatoire a été retranscrit sans soin. Qui parle ? Qui pose les questions ? Rétablis la ponctuation.", "text": "« Où étiez-vous hier {soir »|soir ? »|41} demanda l'inspectrice. « Chez moi, {Répondit|répondit|40} le suspect, je lisais. » Elle {nota ;|nota :|41} « Témoin nerveux. » {Le suspect, se leva|Le suspect se leva|39}, ouvrit la fenêtre et regarda dehors. Il dit qu'il se demandait {s'il pleuvrait ?|s'il pleuvrait.|41} « Vous partez déjà ? » {demanda-elle|demanda-t-elle|40}.", "outro": "La transcription est fidèle : le juge sait enfin qui a dit quoi."}, {"id": "voc-a", "fam": "VOC", "lv": [6, 5], "title": "La carte postale du village", "kind": "Carte postale", "guide": "margot", "intro": "Margot a écrit à sa grand-mère depuis le village. Les mots manquent de précision, et certains sont mal formés.", "text": "Chère mamie, au village, {il y a|se dresse/on voit/s'élève|42} une vieille église. Hier, nous {avons fait|avons préparé/avons cuisiné|42} un gâteau. Le boulanger est {super sympa|très aimable/très gentil/très sympathique|43}. Il m'a montré un parchemin {inlisible|illisible|44} et un {ver|verre|45} en cristal très ancien.", "outro": "Une carte postale digne d'un écrivain. Le village te confie une lettre."}, {"id": "voc-b", "fam": "VOC", "lv": [4, 3], "title": "Le discours du maire", "kind": "Discours", "guide": "hugo", "intro": "Le maire inaugure le nouveau pont. Son discours mélange les registres et les homonymes : ses adversaires vont s'en moquer.", "text": "Chers habitants, notre village {a|possède/abrite|42} un patrimoine exceptionnel. Les travaux du pont nous ont {pris la tête|causé bien des soucis/beaucoup préoccupés/donné du fil à retordre|43}, mais le chantier est terminé. Cette rénovation était {inréalisable|irréalisable|44} sans votre aide. Certains disaient que c'était une mission {inpossible|impossible|44}. Le {conte|compte|45} rendu des travaux sera affiché à la mairie.", "outro": "Discours parfait : le village applaudit."}, {"id": "final", "fam": "ALL", "lv": [6, 5, 4, 3], "title": "Le tribunal des mots", "kind": "Rapport final", "guide": "sacha", "intro": "Toute l'équipe est réunie au QG. Le rapport final sera lu devant le tribunal des mots : la moindre erreur et le voleur sera libéré.", "text": "Rapport final de l'équipe. Le voleur {à|a|1} enfin été démasqué. Les indices que nous avons {réuni|réunis|13} prouvent qu'il {c'est|s'est|4} introduit dans le manoir par la cave. Il {décrochat|décrocha|18} le {tableau puis|tableau, puis|39} il s'enfuit. Le gardien {dont|que|30} nous avons interrogé n'avait rien vu. {Ont|On|3} a retrouvé le tableau dans une malle {ancien|ancienne|11}. Si nous {aurions|avions|23} su plus tôt, nous l'aurions arrêté avant. Le maire nous a {dit bravo|félicités/remerciés|42}.", "outro": "Le tribunal rend son verdict : coupable. L'équipe Mission Correction est décorée."}]</script>

"Héros du tribunal", "icon": "⚖️", "desc": "Résoudre la mission finale."}, {"id": "revision", "name": "Dossiers rouverts", "icon": "♻️", "desc": "Corriger 20 erreurs passées en révision."}, {"id": "regulier", "name": "Enquêteur régulier", "icon": "📅", "desc": "Travailler 5 jours différents."}, {"id": "parcours", "name": "Mission du professeur", "icon": "🎓", "desc": "Terminer un parcours donné par le professeur."}]</script>
<script type="application/json" id="data-tools">[{"id": "remplacer", "name": "Le remplaçant", "icon": "🔁", "how": "Remplace le mot par un autre (avait, était, lui, un verbe du 3e groupe…) : si la phrase tient, tu sais quel mot c'est."}, {"id": "changer-temps", "name": "La machine à remonter le temps", "icon": "⏳", "how": "Mets la phrase à un autre temps : les verbes se révèlent, les autres mots restent immobiles."}, {"id": "changer-nombre", "name": "Le multiplicateur", "icon": "✖️", "how": "Passe du singulier au pluriel : tous les mots qui changent avec le nom font partie de sa bande."}, {"id": "changer-personne", "name": "Le changeur de personne", "icon": "👥", "how": "Remplace je par nous, il par vous : la terminaison qui change te dit à quel groupe appartient le verbe."}, {"id": "questionner", "name": "L'interrogatoire", "icon": "❓", "how": "Pose une question après le verbe (quoi ? qui ? à qui ? où ? quand ?) : la réponse te donne la fonction."}, {"id": "encadrer", "name": "Le projecteur « c'est… qui »", "icon": "🔦", "how": "Encadre un groupe avec « c'est… qui » : s'il entre dans le projecteur, c'est le sujet."}, {"id": "pronominaliser", "name": "Le pronom-espion", "icon": "🕵️", "how": "Remplace le groupe par un pronom (le, la, lui, leur, en, y) : le pronom choisi trahit la fonction."}, {"id": "deplacer", "name": "Le déménageur", "icon": "↔️", "how": "Déplace le groupe dans la phrase : s'il bouge facilement, c'est souvent un complément circonstanciel."}, {"id": "supprimer", "name": "La gomme", "icon": "🧽", "how": "Efface le groupe : si la phrase reste correcte, il n'était pas essentiel."}, {"id": "transformer", "name": "Le transformateur", "icon": "🔄", "how": "Transforme la phrase (active / passive, direct / indirect, affirmative / négative) et observe ce qui change."}, {"id": "famille", "name": "L'arbre généalogique", "icon": "🌳", "how": "Cherche un mot de la même famille ou le féminin : il révèle les lettres muettes et le sens du radical."}]</script>

<script>
/* Mission Correction V3 — by BROT2YOU — ES5 */
(function () {
  'use strict';

  /* ================= DONNÉES ================= */
  function readJSON(id) { return JSON.parse(document.getElementById(id).textContent); }
  var CFG = readJSON('data-config');
  var FAMS = readJSON('data-families');
  var NOTIONS = readJSON('data-notions');
  var MISSIONS = readJSON('data-missions');
  var BADGES = readJSON('data-badges');
  var TOOLS = readJSON('data-tools');
  var GUIDES = readJSON('data-guides');

  var FAM = {}, NUM = {}, TOOL = {}, MIS = {};
  var i;
  for (i = 0; i < FAMS.length; i++) { FAM[FAMS[i].id] = FAMS[i]; }
  for (i = 0; i < NOTIONS.length; i++) { NUM[NOTIONS[i].num] = NOTIONS[i]; }
  for (i = 0; i < TOOLS.length; i++) { TOOL[TOOLS[i].id] = TOOLS[i]; }
  for (i = 0; i < MISSIONS.length; i++) { MIS[MISSIONS[i].id] = MISSIONS[i]; }

  /* ================= OUTILS ================= */
  var app = document.getElementById('app');
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function esc(s) {
    return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function marked(s) { return esc(s).replace(/\[([^\]]+)\]/g, '<mark class="tgt">$1</mark>'); }
  function blankify(s) { return esc(s).replace(/___/g, '<span class="blank">______</span>'); }
  function shuffle(a) {
    var b = a.slice(), j, t, k;
    for (k = b.length - 1; k > 0; k--) { j = Math.floor(Math.random() * (k + 1)); t = b[k]; b[k] = b[j]; b[j] = t; }
    return b;
  }
  function today() { var d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  function frDate() { return new Date().toLocaleDateString('fr-FR'); }
  function each(o, f) { for (var k in o) { if (Object.prototype.hasOwnProperty.call(o, k)) { f(k, o[k]); } } }
  function closest(el, sel) {
    while (el && el.nodeType === 1) {
      if (matches(el, sel)) { return el; }
      el = el.parentNode;
    }
    return null;
  }
  function matches(el, sel) {
    var f = el.matches || el.webkitMatchesSelector || el.msMatchesSelector;
    return f ? f.call(el, sel) : false;
  }
  function norm(s) {
    return String(s || '')
      .replace(/[\u2019\u2018`\u00b4]/g, "'")
      .replace(/[\u00ab\u00bb\u201c\u201d"]/g, '"')
      .replace(/\u00a0|\u202f/g, ' ')
      .replace(/\s+/g, ' ')
      .replace(/\s*([,;:!?."'\-])\s*/g, '$1')
      .replace(/^\s+|\s+$/g, '');
  }
  function levelOf(n) { return Math.max.apply(null, n.lv); }
  function notionForLevel(n, L) { return levelOf(n) >= L; }
  function famNotions(f) { return NOTIONS.filter(function (n) { return n.fam === f; }); }
  function pill(fam, txt, extra) {
    return '<span class="pill f-' + fam + (extra ? ' ' + extra : '') + '">' + esc(txt) + '</span>';
  }
  function codePill(n) { return pill(n.fam, n.num + ' · ' + n.id); }
  function levelsLabel(n) {
    var a = n.lv.slice().sort(function (x, y) { return y - x; });
    return a.map(function (l) { return l + 'e'; }).join(', ');
  }

  /* ================= STOCKAGE ================= */
  var KEY = 'mc3-state';
  function defaultState() {
    return {
      version: 3, profile: null, xp: 0,
      items: {}, streak: 0, bestStreak: 0,
      affaires: {}, missions: {}, letters: {}, finalDone: false,
      copy: [], customCodes: [], parcours: {}, teacherParcours: [],
      badges: {}, days: {}, revisionFixed: 0, copyDay: {},
      settings: { dys: false, size: 'normal', sound: true }
    };
  }
  var state = load();
  function load() {
    var s = null;
    try { s = JSON.parse(localStorage.getItem(KEY)); } catch (e) { s = null; }
    var d = defaultState();
    if (!s || s.version !== 3) { return d; }
    each(d, function (k, v) { if (s[k] === undefined) { s[k] = v; } });
    each(d.settings, function (k, v) { if (s.settings[k] === undefined) { s.settings[k] = v; } });
    return s;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { toast('Sauvegarde impossible : le stockage du navigateur est plein ou bloqué.'); }
  }
  function markDay() { state.days[today()] = true; }

  /* ================= IMAGES (emplacements remplaçables) ================= */
  var IMG = {};
  var pending = 0;
  function preloadImages() {
    each(CFG.images, function (k, src) {
      if (!src) { IMG[k] = false; return; }
      pending++;
      var im = new Image();
      im.onload = function () { IMG[k] = src; done(); };
      im.onerror = function () { IMG[k] = false; done(); };
      im.src = src;
    });
    function done() { pending--; if (pending === 0) { render(); } }
  }
  function slot(key, fallback, cls, alt) {
    if (IMG[key]) { return '<img class="slot-img ' + (cls || '') + '" src="' + esc(IMG[key]) + '" alt="' + esc(alt || '') + '">'; }
    return fallback;
  }

  /* ================= SON ================= */
  var actx = null;
  function sfx(kind) {
    if (!state.settings.sound) { return; }
    try {
      if (!actx) { actx = new (window.AudioContext || window.webkitAudioContext)(); }
      var seq = { ok: [660, 880], ko: [300, 220], win: [523, 659, 784, 1047], click: [700], stamp: [180, 120] }[kind] || [600];
      var t = actx.currentTime;
      for (var k = 0; k < seq.length; k++) {
        var o = actx.createOscillator(), g = actx.createGain();
        o.type = kind === 'stamp' ? 'square' : 'triangle';
        o.frequency.value = seq[k];
        g.gain.setValueAtTime(0.0001, t + k * 0.09);
        g.gain.exponentialRampToValueAtTime(0.08, t + k * 0.09 + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + k * 0.09 + 0.16);
        o.connect(g); g.connect(actx.destination);
        o.start(t + k * 0.09); o.stop(t + k * 0.09 + 0.18);
      }
    } catch (e) { /* son indisponible */ }
  }

  function missionsDone() { var c = 0; each(state.missions, function (k, v) { if (v.done) { c++; } }); return c; }
  function checkBadges() {
    if (countOk() >= 1) { award('premier-indice'); }
    if (countOk() >= 50) { award('fin-limier'); }

    if (a >= NOTIONS.length) { award('grand-detective'); }
    if (state.copy.length >= 5) { award('archiviste'); }
    if (state.copy.length >= 20) { award('memoire'); }
    FAMS.forEach(function (f) {
      var all = famNotions(f.id).every(function (n) { return state.affaires[n.num] && state.affaires[n.num].done; });
      if (all) { award('fam-' + f.id); }
    });
    var three = false;
    each(state.missions, function (k, v) { if (v.stars === 3) { three = true; } });
    if (three) { award('sans-faute'); }
    if (missionsDone() >= 7) { award('explorateur'); }

    if (state.finalDone) { award('tribunal'); }
    if (state.revisionFixed >= 20) { award('revision'); }

  function itemKey(num, idx) { return num + '-' + idx; }
  function notionStars(n) {
    var ok = 0;
    for (var k = 0; k < n.defis.length; k++) {
      var it = state.items[itemKey(n.num, k)];
      if (it && it.last) { ok++; }
    }
    if (ok >= 6) { return 3; }
    if (ok >= 4) { return 2; }
    if (ok >= 2) { return 1; }
    return 0;
  }
  function famMastery(f) {
    var seen = 0, ok = 0;
    famNotions(f).forEach(function (n) {
      for (var k = 0; k < n.defis.length; k++) {
        var it = state.items[itemKey(n.num, k)];
        if (it) { seen++; if (it.last) { ok++; } }
      }
    });
    return { seen: seen, pct: seen ? Math.round(ok / seen * 100) : 0 };
  }
  function reviewItems() {
    var out = [];

  /* ================= PARCOURS (lien prof) ================= */
  function b64enc(obj) {
    var s = unescape(encodeURIComponent(JSON.stringify(obj)));
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function b64dec(str) {
    str = String(str).replace(/-/g, '+').replace(/_/g, '/');
    while (str.length % 4) { str += '='; }
    return JSON.parse(decodeURIComponent(escape(atob(str))));
  }
  function baseURL() { return location.href.split('#')[0]; }
  function parcoursProgress(p) {
    var total = p.c.length * 2, ok = 0;
    p.c.forEach(function (num) {
      if (state.affaires[num] && state.affaires[num].done) { ok++; }
      if (p.best && p.best[num] >= 4) { ok++; }
    });
    return { ok: ok, total: total, pct: total ? Math.round(ok / total * 100) : 0 };
  }
  function importParcours(code) {
    var raw = String(code || '').replace(/^\s+|\s+$/g, '');
    var m = raw.match(/#p=([A-Za-z0-9_\-]+)/);
    if (m) { raw = m[1]; }
    var p;
    try { p = b64dec(raw); } catch (e) { return null; }
    if (!p || p.v !== 3 || !p.id || !p.c || !p.c.length) { return null; }
    p.c = p.c.filter(function (n) { return !!NUM[n]; });
    if (!p.c.length) { return null; }
    var existing = state.parcours[p.id];
    p.best = existing && existing.best ? existing.best : {};
    p.joined = existing && existing.joined ? existing.joined : frDate();
    state.parcours[p.id] = p;
    if (p.x && p.x.length) {
      p.x.forEach(function (cc) {
        var dup = state.customCodes.some(function (o) { return o.abbr === cc[0]; });
        if (!dup && NUM[cc[2]]) { state.customCodes.push({ abbr: cc[0], meaning: cc[1], num: cc[2], fromTeacher: true }); }
      });
    }
    save();
    return p;
  }

  function profGuide() {
    return '<div class="guide-text">' +
      '<h3>La démarche</h3><p>Chaque notion est une affaire menée par induction : l\'élève classe un corpus de phrases, choisit entre une bonne piste et des fausses pistes (chacune réfutée par un contre-exemple), teste son hypothèse sur de nouveaux cas, puis rédige la règle avec ses mots avant de la comparer au rapport officiel. Il termine par une chasse à l\'erreur en contexte.</p>' +
      '<h3>Corriger une copie</h3><p>Notez le numéro du code dans la marge et soulignez le passage. En classe ou à la maison, l\'élève recopie le passage dans « Ma copie », touche les mots soulignés, choisit le code, écrit sa correction et la règle. Son carnet garde tout ; ses trois codes les plus fréquents deviennent ses « pièges personnels » pour la copie suivante.</p>' +
      '<h3>Après la copie</h3><p>Créez un parcours avec les codes les plus fréquents de la classe et partagez le lien. Pour chaque code, l\'élève mène l\'enquête puis doit réussir au moins 4 défis sur 6. La fiche bilan imprimable vous donne une trace de son travail.</p>' +
      '<h3>Missions</h3><p>Quinze documents à corriger (deux par lieu, un pour les 6e-5e et un pour les 4e-3e, plus une mission finale mêlant toutes les familles) : l\'élève repère l\'erreur, choisit le code parmi quatre, puis corrige.</p>' +
      '<h3>Programmes et orthographe rectifiée</h3><p>Les niveaux indiqués pour chaque notion sont des repères de progression : à vérifier au regard du programme du cycle 3 (6e), du nouveau programme du cycle 4 (BO n° 10 du 5 mars 2026) en vigueur en 5e à la rentrée 2026, et du programme de 2020 pour la 4e et la 3e. Les rectifications de 1990 sont signalées dans les fiches concernées ; les corrections automatiques acceptent alors les deux graphies quand elles sont prévues.</p>' +
      '<h3>Ce que l\'appli ne fait pas</h3><p>Elle ne corrige pas automatiquement un texte libre : la correction proposée par l\'élève dans « Ma copie » n\'est pas évaluée. Elle ne remonte aucune donnée au professeur : le suivi passe par la fiche bilan imprimée ou exportée.</p></div>';
  }

      ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('Lien copié.'); } catch (e) { toast('Sélectionnez le lien et copiez-le.'); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(function () { toast('Lien copié.'); }, fallback);
    } else { fallback(); }
  }
  function download(name, data, mime) {
    var b = new Blob([data], { type: mime }), url = URL.createObjectURL(b), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 800);
  }

  /* ================= ÉVÉNEMENTS ================= */
  document.addEventListener('click', function (e) {
    var el = closest(e.target, '[data-go],[data-a]');
    if (!el) { if (e.target.id === 'modal') { closeModal(); } return; }
    if (el.disabled) { return; }
    var g = el.getAttribute('data-go');
    if (g) { e.preventDefault(); sfx('click'); go(g); return; }
    var a = el.getAttribute('data-a');
    if (a === 'pf-check') { A[a](null, el); return; }
    if (A[a]) { e.preventDefault(); A[a](el.getAttribute('data-v'), el); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeModal(); }
    if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.getAttribute && e.target.getAttribute('role') === 'button') {
      e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true }));
    }
    if (e.key === 'Enter' && e.target && e.target.tagName === 'INPUT') {
      var map = { 'terrain-fix': 'terrain-check', 'doc-fix': 'doc-fix', 'copy-num': 'copy-num', 'final-code': 'final-code' };
      if (map[e.target.id]) { e.preventDefault(); A[map[e.target.id]](); }
    }
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'train-notion') { ui.trainNotion = +e.target.value; }
    if (e.target.id === 'import-file') {
      var f = e.target.files[0];
      if (!f) { return; }
      var r = new FileReader();
      r.onload = function () {
        var d;
        try { d = JSON.parse(r.result); } catch (err) { d = null; }
        if (!d || d.version !== 3 || typeof d.items !== 'object' || !d.copy || !d.affaires) { toast('Fichier non reconnu : ce n\'est pas une sauvegarde Mission Correction V3.'); return; }
        confirmBox('Remplacer les données ?', 'Les données actuelles de cet appareil seront remplacées par la sauvegarde.', 'Remplacer', function () {
          localStorage.setItem(KEY, JSON.stringify(d)); state = load(); toast('Sauvegarde importée.'); go('home');
        });
      };
      r.readAsText(f);
    }
  });
  $('#btn-settings').addEventListener('click', function () { A.settings(); });

  /* ================= DÉMARRAGE ================= */
  if (state.profile) { markDay(); save(); }
  render();
  preloadImages();

  window.MC = { state: function () { return state; }, A: A, go: go, NOTIONS: NOTIONS, MISSIONS: MISSIONS };
})();

</script>
</body>
</html>
