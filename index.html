<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mission Correction — le jeu qui t'aide à corriger, comprendre et progresser en français</title>
<meta name="description" content="Mission Correction : codes de correction numérotés, enquêtes grammaticales par induction, défis, missions et parcours professeur. Collège, 6e à 3e. By BROT2YOU APP.">
<meta name="theme-color" content="#5a3519">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔎</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Fredoka:wght@400;500;600;700&family=Kalam:wght@400;700&family=Lexend:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --night:#16223f;--night2:#2a4170;--wood:#6e4322;--wood-d:#4a2b14;--wood-l:#946034;
  --parch:#f6e7c3;--parch2:#ebd39d;--edge:#8a5a2b;--ink:#3b2412;--ink2:#6b4a2c;
  --gold:#f2c14e;--gold-d:#b8862b;--gold-l:#fff3c4;
  --ORTH:#d8433b;--ORTH-d:#9e2a24;--ACC:#2f7fe0;--ACC-d:#1d56a3;--CONJ:#2fa64e;--CONJ-d:#1d7434;
  --GRAM:#c9921f;--GRAM-d:#8c6512;--SYN:#8a4fd6;--SYN-d:#5f2fa3;--PONC:#f0891c;--PONC-d:#b45f08;--VOC:#18a3a0;--VOC-d:#0d716f;
  --ui:'Fredoka',system-ui,-apple-system,'Segoe UI',sans-serif;
  --title:'Cinzel',Georgia,'Times New Roman',serif;
  --hand:'Kalam','Comic Sans MS','Segoe Print',cursive;
  --r:14px;color-scheme:light;
}
html.dys{--ui:'Lexend',system-ui,sans-serif;--hand:'Lexend',system-ui,sans-serif;letter-spacing:.02em;word-spacing:.12em}
html.dys body{line-height:1.75}
html.size-large{font-size:19px}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html{background:#101a33}
body{margin:0;min-height:100vh;font-family:var(--ui);color:var(--ink);font-size:1.02rem;line-height:1.5;
  background:radial-gradient(ellipse 120% 70% at 50% 0%,#34508a 0%,#1d2d55 45%,#101a33 100%) fixed;}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.55;
  background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff 60%,transparent 61%),radial-gradient(1px 1px at 28% 8%,#fff 60%,transparent 61%),radial-gradient(1.5px 1.5px at 67% 12%,#ffe9a8 60%,transparent 61%),radial-gradient(1px 1px at 82% 26%,#fff 60%,transparent 61%),radial-gradient(1px 1px at 45% 22%,#fff 60%,transparent 61%),radial-gradient(1.5px 1.5px at 91% 6%,#fff 60%,transparent 61%),radial-gradient(1px 1px at 6% 40%,#fff 60%,transparent 61%);}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}
img{max-width:100%}

/* ---------- En-tête ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:8px 14px;
  background:linear-gradient(#7a4a25,#5a3519);border-bottom:4px solid var(--wood-d);box-shadow:0 4px 12px rgba(0,0,0,.4)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:#7a4a25}
.logo{background:none;border:0;padding:0;display:flex;align-items:center;gap:8px;text-align:left}
.logo-text,.logo-big{font-family:var(--title);font-weight:900;line-height:.92;text-transform:uppercase;letter-spacing:.02em;
  background:linear-gradient(180deg,#fff7d6 0%,#f7d77a 45%,#d39a2c 70%,#f2c14e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:1.2px #3b2412;filter:drop-shadow(0 3px 0 #2a170a)}
.logo-text{font-size:1.15rem}
.logo-text small{display:block;font-size:.62em;letter-spacing:.08em}
.status{margin-left:auto;display:flex;align-items:center;gap:10px;color:#fff;font-weight:600}
.avatar{width:44px;height:44px;border-radius:50%;border:3px solid var(--gold);background:var(--gc,#b8862b);display:grid;place-items:center;overflow:hidden;
  box-shadow:0 2px 0 #2a170a;font-weight:700;font-size:1.2rem;color:#fff;padding:0}
.avatar .face-img{width:100%;height:100%;object-fit:cover}
.lvl-box{display:flex;flex-direction:column;gap:3px;min-width:120px}
.lvl-line{display:flex;justify-content:space-between;font-size:.86rem;gap:10px}
.xpbar{height:10px;border-radius:6px;background:#2a170a;border:2px solid #2a170a;overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3b82f6,#22c55e 55%,#facc15);border-radius:4px;transition:width .5s}
.coin{width:34px;height:34px;border-radius:50%;border:3px solid #8c6512;background:radial-gradient(circle at 35% 30%,#fff3c4,#f2c14e 55%,#c9921f);display:grid;place-items:center;color:#7a4a22;font-size:1rem;box-shadow:0 2px 0 #2a170a}
@media (max-width:520px){.logo-text{font-size:.92rem}.lvl-box{min-width:84px}.coin{display:none}}

/* ---------- Mise en page ---------- */
main{max-width:1100px;margin:0 auto;padding:16px 14px 60px}
.page{display:flex;flex-direction:column;gap:16px}
.page-head{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px}
.head-spacer{width:48px}
.btn-home{width:48px;height:48px;border-radius:50%;border:3px solid var(--wood-d);background:radial-gradient(circle at 40% 35%,#ffe9a8,#e0ad45);font-size:1.5rem;line-height:1;color:var(--wood-d);box-shadow:0 3px 0 var(--wood-d);display:grid;place-items:center}
.ribbon-wrap{position:relative;z-index:0;display:flex;justify-content:center;margin:0}
.ribbon{position:relative;margin:0;padding:.38em 1.4em;font-family:var(--ui);font-weight:700;font-size:clamp(1.15rem,3.6vw,1.65rem);color:var(--wood-d);text-align:center;
  background:linear-gradient(#fbefcf,#ead09a);border:3px solid #7a4a22;border-radius:6px;box-shadow:0 4px 0 rgba(42,23,10,.55)}
.ribbon::before,.ribbon::after{content:"";position:absolute;top:28%;width:1.5em;height:100%;background:#d8b879;border:3px solid #7a4a22;z-index:-1}
.ribbon::before{left:-1.2em;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,35% 50%)}
.ribbon::after{right:-1.2em;clip-path:polygon(0 0,100% 0,65% 50%,100% 100%,0 100%)}
.parch{position:relative;background:radial-gradient(ellipse at 30% 20%,#fbf0d4 0%,var(--parch) 45%,var(--parch2) 100%);border:3px solid var(--edge);border-radius:var(--r);
  box-shadow:inset 0 0 30px rgba(140,90,40,.28),0 5px 0 var(--wood-d),0 10px 22px rgba(0,0,0,.4)}
.pad{padding:18px}
.center{text-align:center}
.lead{font-size:1.06rem;color:var(--ink2);margin:.2em 0 1em}
.muted{color:#7a6248}
.small-note{font-size:.88rem}
.sec-title{font-size:1.2rem;margin:.6em 0 .5em;color:var(--wood-d)}
h2,h3{line-height:1.25}

/* ---------- Boutons bonbon ---------- */
.btn{border:0;border-radius:14px;padding:.72em 1.25em;font-weight:700;color:#fff;letter-spacing:.01em;text-shadow:0 1px 0 rgba(0,0,0,.28);
  background:linear-gradient(#a98bff,#7a4ddb);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -3px 0 rgba(0,0,0,.18),0 4px 0 #4c2a92;transition:transform .08s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 1px 0 #4c2a92}
.btn.big{font-size:1.12rem;padding:.85em 1.6em}
.btn.small{font-size:.88rem;padding:.5em .9em}
.btn-purple{background:linear-gradient(#b48cff,#8452e0);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -3px 0 rgba(0,0,0,.18),0 4px 0 #4c2a92}
.btn-green{background:linear-gradient(#7ee08e,#34b04c);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -3px 0 rgba(0,0,0,.16),0 4px 0 #1d6e30}
.btn-blue{background:linear-gradient(#78b6ff,#2f7fe0);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -3px 0 rgba(0,0,0,.16),0 4px 0 #1a4f93}
.btn-gold{color:#4a2b14;text-shadow:0 1px 0 rgba(255,255,255,.5);background:linear-gradient(#ffe9a0,#f2b93a);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),inset 0 -3px 0 rgba(0,0,0,.14),0 4px 0 #8c6512}
.btn-red{background:linear-gradient(#ff8a7d,#d8433b);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -3px 0 rgba(0,0,0,.16),0 4px 0 #8a221c}
.btn-ghost{color:var(--wood-d);text-shadow:none;background:linear-gradient(#fff6de,#efd9a8);border:2px solid var(--edge);box-shadow:0 3px 0 var(--edge)}
.row-btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:16px}
.row-btns.left{justify-content:flex-start}
.link-btn{background:none;border:0;padding:6px 0;color:#1d56a3;text-decoration:underline;text-underline-offset:3px;font-weight:600}

/* ---------- Pastilles familles ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:10px;padding:.32em .8em;font-weight:700;font-size:.9rem;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25);
  background:var(--pc,#6b4a2c);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 3px 0 var(--pd,#3b2412)}
.pill-row{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.pill-row.top{margin-top:14px}
button.pill{opacity:.82}
button.pill.on,button.pill:hover{opacity:1;transform:translateY(-1px)}
button.pill.on{outline:3px solid var(--gold);outline-offset:2px}
.f-ORTH{--pc:var(--ORTH);--pd:var(--ORTH-d)}.f-ACC{--pc:var(--ACC);--pd:var(--ACC-d)}.f-CONJ{--pc:var(--CONJ);--pd:var(--CONJ-d)}
.f-GRAM{--pc:var(--GRAM);--pd:var(--GRAM-d)}.f-SYN{--pc:var(--SYN);--pd:var(--SYN-d)}.f-PONC{--pc:var(--PONC);--pd:var(--PONC-d)}.f-VOC{--pc:var(--VOC);--pd:var(--VOC-d)}
.f-ALL{--pc:#6b4a2c;--pd:#3b2412}
.pill-x{background:rgba(0,0,0,.25);border:0;color:#fff;border-radius:50%;width:22px;height:22px;line-height:1;padding:0}
.num-badge{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 6px;border-radius:10px;font-weight:700;color:#fff;background:var(--pc);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 3px 0 var(--pd);text-shadow:0 1px 0 rgba(0,0,0,.3)}

/* ---------- Accueil ---------- */
.home{display:flex;flex-direction:column;gap:18px}
.hero{border-radius:18px;overflow:hidden;border:4px solid var(--wood-d);box-shadow:0 6px 0 #2a170a,0 14px 30px rgba(0,0,0,.5);background:#22345e}
.hero-img{display:block;width:100%;height:auto}
.hero-fb{position:relative;min-height:230px;display:flex;align-items:center;justify-content:center;gap:4%;padding:24px;overflow:hidden;
  background:linear-gradient(180deg,#26306a 0%,#4b4596 45%,#c9799a 85%,#e8a07a 100%)}
.hero-manor{position:absolute;inset:0;width:100%;height:100%}
.hero-sky-unused{position:absolute;inset:0;background:radial-gradient(circle at 80% 22%,#ffe9a8 0 26px,rgba(255,233,168,.35) 27px 60px,transparent 61px),
  linear-gradient(transparent 62%,#2b2550 62%,#2b2550 64%,transparent 64%),
  repeating-linear-gradient(90deg,transparent 0 46px,#2d2856 46px 52px,transparent 52px 70px);opacity:.9}

.emblem{position:relative;z-index:1;width:min(30vw,170px);height:auto;filter:drop-shadow(0 6px 0 rgba(0,0,0,.35))}
.hero-title{position:relative;z-index:1;display:flex;flex-direction:column;align-items:flex-start;gap:12px;max-width:560px}
.logo-big{font-size:clamp(2.1rem,7.5vw,4.4rem);-webkit-text-stroke:2px #3b2412;filter:drop-shadow(0 5px 0 #2a170a)}
.hero-sub{background:linear-gradient(#fbefcf,#ead09a);border:3px solid #7a4a22;border-radius:8px;padding:.35em .9em;font-weight:600;color:var(--wood-d);transform:rotate(-2deg);box-shadow:0 3px 0 rgba(42,23,10,.6)}
.hero.small .hero-fb{min-height:150px}
.hero.small .logo-big{font-size:clamp(1.8rem,6vw,3rem)}
.board{position:relative;padding:22px 18px 22px;border-radius:18px;border:6px solid var(--wood-d);background-size:cover;background-position:center;
  background-color:#7a4a25;background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.0) 0 96px,rgba(0,0,0,.18) 96px 99px),linear-gradient(180deg,#8c5a30,#6e4322);
  box-shadow:inset 0 0 40px rgba(0,0,0,.45),0 6px 0 #2a170a,0 14px 30px rgba(0,0,0,.45)}
.board .ribbon-wrap{margin-bottom:18px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,1fr);gap:12px}}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:14px 8px 12px;min-height:150px;border-radius:12px;border:3px solid #7a4a22;
  background:radial-gradient(ellipse at 40% 30%,#fff6dc,#eed6a0);box-shadow:inset 0 0 18px rgba(140,90,40,.3),0 5px 0 #3b2412;transition:transform .12s}
.tile:hover{transform:translateY(-3px) rotate(-.6deg)}
.tile svg,.tile .tile-img{width:72px;height:72px;object-fit:contain;margin-bottom:6px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.18))}
.tile b{font-size:1.05rem;color:var(--wood-d);line-height:1.15}
.tile small{color:var(--ink2);font-size:.86rem}
.home-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.next-card{padding:16px 18px}
.next-card h3{margin:.1em 0 .5em;color:var(--wood-d)}
.home-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.parc-line{display:grid;grid-template-columns:1fr 110px 50px;align-items:center;gap:10px;width:100%;text-align:left;padding:10px;border-radius:10px;border:2px solid var(--edge);background:#fff7e2;margin:6px 0}
.mini-bar{display:block;height:10px;border-radius:6px;background:#d9c18e;overflow:hidden}
.mini-bar i{display:block;height:100%;background:linear-gradient(90deg,#34b04c,#9be36a)}
.mini-bar.wide{flex:1;min-width:120px}

/* ---------- Formulaires ---------- */
.field{display:flex;flex-direction:column;gap:6px;font-weight:600;color:var(--wood-d);margin:10px 0}
.field-label{font-weight:700;color:var(--wood-d);margin:14px 0 6px}
.input{font:inherit;font-weight:400;color:var(--ink);padding:.65em .8em;border-radius:10px;border:2px solid var(--edge);background:#fffaf0;width:100%}
.input:focus{outline:3px solid var(--gold);outline-offset:1px}
textarea.input{resize:vertical}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg-btn{min-width:58px;padding:.5em .9em;border-radius:10px;border:2px solid var(--edge);background:#fff6de;font-weight:700;color:var(--wood-d);box-shadow:0 3px 0 var(--edge)}
.seg-btn.on{background:linear-gradient(#ffe9a0,#f2b93a);border-color:#8c6512;box-shadow:0 3px 0 #8c6512}
.check{display:flex;align-items:flex-start;gap:8px;margin:8px 0;font-weight:500}
.check input{width:20px;height:20px;margin-top:2px;accent-color:#2fa64e}
.grid2{display:grid;grid-template-columns:1fr 2fr;gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.notice{margin-top:14px;padding:12px 14px;border-radius:10px;background:#fff1c8;border:2px dashed var(--gold-d);font-size:.95rem}
.code-input{text-align:center;font-family:var(--title);font-weight:900;font-size:1.6rem;letter-spacing:.3em;text-transform:uppercase}

/* ---------- Profil ---------- */
.avatars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.avatars{grid-template-columns:repeat(2,1fr)}}
.avatar-pick{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:12px;border:2px solid var(--edge);background:#fff7e2;box-shadow:0 3px 0 var(--edge)}
.avatar-pick.on{background:#fff0b8;border-color:#8c6512;outline:3px solid var(--gold)}
.avatar-pick small{color:var(--ink2);font-size:.8rem}
.guide-face{flex:none;width:52px;height:52px;border-radius:50%;background:var(--gc);border:3px solid var(--gold);display:grid;place-items:center;overflow:hidden;color:#fff;font-weight:700;font-size:1.3rem;box-shadow:0 3px 0 #2a170a}
.guide-face.big{width:70px;height:70px;font-size:1.8rem}
.guide-face .face-img{width:100%;height:100%;object-fit:cover}
.guide-line{display:flex;gap:12px;align-items:flex-start;margin:0 0 14px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.55);border:2px solid rgba(138,90,43,.35)}
.guide-line p{margin:0}

/* ---------- Règles ---------- */
.notion-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.notion-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;text-align:left;padding:10px 12px;border-radius:12px;border:2px solid rgba(138,90,43,.45);background:#fff8e6}
.notion-row:hover{background:#fff1cc}
.notion-row.done{background:#f0f8e8;border-color:#7fbf86}
.nr-main{display:flex;flex-direction:column}
.nr-main small{color:#7a6248}
.nr-side{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.lock{font-size:.82rem;color:#8a6a4a;font-weight:600}
.stamp-mini{font-size:.72rem;font-weight:700;color:#1d7434;border:2px solid #1d7434;border-radius:6px;padding:0 6px;transform:rotate(-4deg)}
.stars{white-space:nowrap}
.star{color:#cdb98c;font-size:1.1rem;text-shadow:0 1px 0 rgba(0,0,0,.2)}
.star.on{color:#f2b93a;text-shadow:0 1px 0 #8c6512}
.rule-layout{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:start}
@media (max-width:760px){.rule-layout{grid-template-columns:1fr}.mascot{display:none}}
.mascot{position:sticky;top:90px}
.mascot-img{border-radius:14px}
.mascot-fb{display:grid;place-items:center;padding:20px;background:rgba(255,255,255,.08);border-radius:16px}
.mascot-fb .emblem{width:150px}
.report{display:flex;flex-direction:column;gap:12px}
.report-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.report-head h2{margin:0;color:var(--wood-d)}
.rule-box{position:relative;background:#fffdf5;border:2px solid var(--edge);border-radius:12px;padding:14px 16px 12px}
.rule-box p{margin:.2em 0;font-size:1.05rem}
.rule-box.small p{font-size:.95rem}
.rb-label{position:absolute;top:-12px;left:12px;background:#ffe27a;border:2px solid #8c6512;border-radius:6px;padding:0 8px;font-weight:700;font-size:.85rem}
.tool-box{display:flex;gap:12px;align-items:flex-start;background:#e9f2ff;border:2px solid #7aa7e0;border-radius:12px;padding:12px}
.tool-box p{margin:.15em 0 0}
.tool-box.small{font-size:.92rem;margin:10px 0}
.tool-ico{font-size:1.7rem;line-height:1}
.tool-ico.big{font-size:2.2rem}
.ex-box{background:#fff7d0;border-left:6px solid #f2c14e;border-radius:8px;padding:10px 12px}
.trap-box{background:#ffe9e4;border-left:6px solid var(--ORTH);border-radius:8px;padding:10px 12px}
.note-box{background:#eef8ef;border-left:6px solid var(--CONJ);border-radius:8px;padding:10px 12px;font-size:.95rem}
.mine-box{background:#f3ecff;border:2px dashed var(--SYN);border-radius:12px;padding:10px 14px}
.mine-box p{margin:.3em 0 0;font-family:var(--hand);font-size:1.12rem}
.locked-rule h2{margin:.4em 0 .2em;color:var(--wood-d)}
.blurred{filter:blur(6px);user-select:none;padding:12px;background:#fffdf5;border-radius:10px;margin:12px 0}
.tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tool-card{background:#fffaf0;border:2px solid var(--edge);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px}
.tool-card p{margin:.2em 0;font-size:.95rem}
.tool-card small{color:#7a6248}

/* ---------- Enquête ---------- */
.case-head{display:flex;gap:14px;align-items:center;padding:12px 16px}
.case-head h2{margin:0;font-size:1.25rem;color:var(--wood-d)}
.case-head p{margin:.2em 0 0;color:var(--ink2)}
.stepper{list-style:none;display:flex;gap:6px;margin:0;padding:0;counter-reset:s}
.stepper li{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:#e9dcc0;font-size:.82rem;text-align:center}
.stepper li span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:#4a3a2a;border:3px solid #7a6248;color:#e9dcc0}
.stepper li.done span{background:#34b04c;border-color:#1d6e30;color:#fff}
.stepper li.cur span{background:var(--gold);border-color:#8c6512;color:var(--wood-d);transform:scale(1.12)}
.stepper li.cur em{color:#fff;font-weight:700}
.stepper em{font-style:normal}
@media (max-width:560px){.stepper em{display:none}}
.exhibit{margin:0;font-size:1.08rem}
mark.tgt{background:linear-gradient(transparent 55%,#ffd75e 55%);color:inherit;font-weight:700;padding:0 2px}
.sort-list{display:flex;flex-direction:column;gap:10px}
.sort-item{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:#fffdf5;border:2px solid rgba(138,90,43,.4)}
.sort-item.wrong{border-color:var(--ORTH);background:#fff0ed;animation:shake .35s}
.sort-item.right{border-color:#4caf50;background:#f1faee}
.sort-btns{display:flex;flex-wrap:wrap;gap:6px}
.sort-btn{padding:.38em .8em;border-radius:9px;border:2px solid var(--edge);background:#fff6de;font-weight:600;color:var(--wood-d)}
.sort-btn.on{background:#2f7fe0;border-color:#1d56a3;color:#fff}
.board-pins{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.pin-col{background:#fffdf5;border:2px solid var(--edge);border-radius:10px;padding:10px;position:relative}
.pin-col::before{content:"";position:absolute;top:-8px;left:50%;width:14px;height:14px;border-radius:50%;background:#d8433b;box-shadow:0 2px 0 #7a1d18;transform:translateX(-50%)}
.pin-col b{display:block;text-align:center;color:var(--wood-d);margin-bottom:6px}
.pin-col p{margin:.25em 0;font-size:.95rem}
.hyp-list{display:flex;flex-direction:column;gap:10px}
.hyp{position:relative;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--edge);background:#fffaf0;display:flex;flex-direction:column;gap:6px;font-size:1rem}
.hyp:hover:not(:disabled){background:#fff1cc}
.hyp:disabled{opacity:1}
.hyp.refuted span{text-decoration:line-through;color:#8a7a68}
.hyp.refuted{background:#f6ece0}
.hyp.confirmed{background:#eaf7e6;border-color:#4caf50}
.hyp small{color:#7a1d18;font-size:.93rem}
.stamp{position:absolute;top:8px;right:10px;font-style:normal;font-weight:700;font-size:.8rem;color:var(--ORTH);border:3px solid var(--ORTH);border-radius:6px;padding:1px 8px;transform:rotate(6deg);background:rgba(255,255,255,.7);animation:stamp .25s ease-out}
.stamp.ok{color:#1d7434;border-color:#1d7434}
.question{font-size:clamp(1.25rem,3.6vw,1.75rem);text-align:center;margin:.4em 0 .8em;color:var(--ink)}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--ink);color:transparent;line-height:1}
.choices{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.choice{min-width:140px;border:0;border-radius:16px;padding:.8em 1.3em;font-weight:700;font-size:1.15rem;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.28)}
.choice.c0{background:linear-gradient(#b48cff,#8452e0);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 5px 0 #4c2a92}
.choice.c1{background:linear-gradient(#7ee08e,#34b04c);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 5px 0 #1d6e30}
.choice.c2{background:linear-gradient(#78b6ff,#2f7fe0);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 5px 0 #1a4f93}
.choice:disabled{opacity:1}
.choice.right{outline:4px solid #f2c14e;outline-offset:2px;animation:pop .3s}
.choice.wrong{background:linear-gradient(#ff8a7d,#d8433b);box-shadow:0 5px 0 #8a221c;animation:shake .35s}
.choice.dim{filter:grayscale(.7);opacity:.55}
.feedback{margin-top:18px;padding:12px 16px;border-radius:12px;border:2px solid}
.feedback p{margin:.3em 0 0}
.feedback.good{background:#eaf7e6;border-color:#4caf50}
.feedback.bad{background:#fff1e6;border-color:#f0891c}
.hint{background:#fff7d0;border-radius:10px;padding:8px 12px;font-size:.95rem}
.compare{display:grid;gap:14px}
.case-closed{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.big-stamp{font-family:var(--title);font-weight:900;font-size:clamp(1.5rem,5vw,2.3rem);color:#1d7434;border:5px solid #1d7434;border-radius:10px;padding:.1em .6em;transform:rotate(-5deg);animation:stamp .35s ease-out;text-transform:uppercase}

/* ---------- Texte cliquable ---------- */
.copy-font{font-family:var(--hand)}
.click-text{font-size:clamp(1.15rem,3vw,1.4rem);line-height:2.1;margin:0}
.click-text .w{border:0;background:none;padding:0 1px;margin:0;border-radius:4px;font:inherit;color:inherit;line-height:inherit;cursor:pointer}
.click-text .w:hover{background:#ffe9a0}
.click-text .w.sel{background:#ffb3a8;box-shadow:0 2px 0 var(--ORTH)}
.click-text .w.hinted{animation:blink 1s infinite}
.fixed{background:#c9f0c2;border-radius:4px;padding:0 3px;font-weight:700;color:#1d5a28;box-shadow:0 2px 0 #4caf50}
.seyes{font-size:clamp(1.15rem,3vw,1.4rem);background-color:#fffdf7;background-image:linear-gradient(90deg,transparent 54px,#e8848a 54px,#e8848a 56px,transparent 56px),repeating-linear-gradient(transparent 0 calc(2.1em - 1px),#c9c4ec calc(2.1em - 1px) 2.1em);background-position:0 18px;padding:18px 18px 18px 70px}
.seyes .click-text{font-size:1em;line-height:2.1em}
.seyes .link-btn{font-size:1rem}
.copy-layout,.doc-layout{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start}
@media (max-width:820px){.copy-layout,.doc-layout{grid-template-columns:1fr}}
.copy-sheet{padding:18px}
.copy-side h3,.doc-side h3{margin:.1em 0 .5em;color:var(--wood-d)}
.howto{list-style:none;padding:0;margin:0 0 12px;display:flex;flex-direction:column;gap:8px}
.howto li{display:flex;align-items:center;gap:10px;font-weight:600}
.hi{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700}
.hi1{background:#2f4c7a}.hi2{background:var(--ORTH)}.hi3{background:var(--CONJ)}
.code-choices{display:flex;flex-direction:column;gap:8px;margin:8px 0 12px}
.code-btn{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 10px;border-radius:10px;border:2px solid var(--pc);background:#fffaf0;font-weight:600}
.code-btn:hover{background:#fff1cc}
.carnet .entry,.entry{background:#fffdf5;border:2px solid rgba(138,90,43,.4);border-radius:12px;padding:10px 14px;margin:10px 0}
.entry p{margin:.35em 0}
.entry-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag-before,.tag-after{font-size:.78rem;font-weight:700;color:#fff;border-radius:5px;padding:1px 6px}
.tag-before{background:var(--ORTH)}.tag-after{background:var(--CONJ)}
.traps{background:#fff1c8;border:2px dashed var(--gold-d);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.traps p{margin:.2em 0 .4em}
.small{font-size:.95rem}

/* ---------- Entraînement ---------- */
.quiz-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:#fff;font-weight:600}
.quiz-card{padding:22px 18px}
.result{font-family:var(--title);font-weight:900;font-size:3rem;color:var(--wood-d)}
.xp-gain{font-weight:700;color:#1d7434;font-size:1.15rem}

/* ---------- Missions ---------- */
.page.wide{max-width:1100px}
.map-wrap{position:relative;border-radius:18px;overflow:hidden;border:5px solid var(--wood-d);box-shadow:0 6px 0 #2a170a,0 14px 30px rgba(0,0,0,.5);background:#1f6fa8}
.map-svg,.map-img{display:block;width:100%;height:auto}
.map-spot{cursor:pointer;transition:transform .15s;transform-box:fill-box;transform-origin:center}
.map-spot:hover,.map-spot:focus{transform:scale(1.06)}
.map-spot.locked{opacity:.85}
.map-label,.hotspot{position:absolute;transform:translate(-50%,-50%);border:3px solid #7a4a22;border-radius:8px;background:linear-gradient(#fbefcf,#ead09a);color:var(--wood-d);font-weight:700;padding:.15em .7em;font-size:clamp(.72rem,1.9vw,1rem);box-shadow:0 3px 0 rgba(42,23,10,.6);white-space:nowrap}
.map-label.final{background:linear-gradient(#ffe9a0,#f2b93a)}
.hotspot{width:clamp(36px,7vw,64px);height:clamp(36px,7vw,64px);border-radius:50%;padding:0;background:rgba(255,243,196,.35);border-color:rgba(242,193,78,.9);font-family:var(--title);font-size:1.3rem;color:#fff;text-shadow:0 2px 0 #2a170a}
.hotspot:hover{background:rgba(255,243,196,.6)}
.clues{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.clue{width:46px;height:56px;display:grid;place-items:center;font-family:var(--title);font-weight:900;font-size:1.6rem;border-radius:10px;border:3px dashed #a88a5a;color:#a88a5a;background:#fff7e2}
.clue.got{border:3px solid var(--fc);color:#fff;background:var(--fc);box-shadow:0 4px 0 rgba(0,0,0,.3)}
.clue.big{width:80px;height:96px;font-size:3rem;margin:0 auto;animation:pop .4s}
.zone-title{font-family:var(--title);font-weight:900;margin:.1em 0 .6em;text-align:center}
.doc-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.doc-card{position:relative;background:#fffdf5;border:2px solid var(--edge);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px}
.doc-card h3{margin:.1em 0}
.doc-card p{margin:.2em 0}
.doc-card .btn{align-self:flex-start;margin-top:8px}
.doc-kind{display:inline-block;align-self:flex-start;font-size:.78rem;font-weight:700;color:#fff;background:#6b4a2c;border-radius:6px;padding:2px 8px}
.doc-meta{font-size:.88rem;color:#7a6248}
.doc-top{display:flex;gap:16px;align-items:center;flex-wrap:wrap;color:#fff}
.doc-top .btn{margin-left:auto}
.doc-paper{padding:22px 20px;background:radial-gradient(ellipse at 30% 20%,#fffaf0,#f3e3bb);transform:rotate(-.4deg)}
.doc-paper .doc-kind{margin-bottom:10px}

/* ---------- Parcours & stats ---------- */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.stat-row div{background:#fffdf5;border:2px solid var(--edge);border-radius:12px;padding:10px;text-align:center;display:flex;flex-direction:column}
.stat-row b{font-size:1.5rem;color:var(--wood-d)}
.stat-row small{color:#7a6248}
.mastery{display:flex;flex-direction:column;gap:10px}
.m-row{display:grid;grid-template-columns:34px 120px 1fr 54px 110px;align-items:center;gap:10px}
@media (max-width:620px){.m-row{grid-template-columns:30px 1fr 54px}.m-row .m-bar{grid-column:1/-1;grid-row:2}.m-row small{display:none}}
.m-ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;background:var(--pc);box-shadow:0 2px 0 var(--pd)}
.m-bar{height:16px;border-radius:9px;background:#e2cfa5;border:2px solid #b49b6b;overflow:hidden}
.m-bar i{display:block;height:100%;border-radius:6px;transition:width .6s}
.m-pct{font-weight:700;text-align:right}
.teacher-note{background:#e9f2ff;border:2px solid #7aa7e0;border-radius:12px;padding:10px 14px;margin:10px 0}
.teacher-note p{margin:.3em 0 0}
.pc-steps{padding-left:1.4em;display:flex;flex-direction:column;gap:12px}
.pc-step{background:#fffdf5;border:2px solid rgba(138,90,43,.4);border-radius:12px;padding:10px 14px}
.pc-step b{margin-left:8px}

/* ---------- Badges & collection ---------- */
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:10px 6px}
.shield{width:86px;height:96px;display:grid;place-items:center;font-size:2.3rem;background:linear-gradient(#b9a98a,#8f8068);
  clip-path:polygon(50% 0,100% 15%,100% 55%,50% 100%,0 55%,0 15%);filter:drop-shadow(0 3px 0 #2a170a)}
.badge.got .shield{background:linear-gradient(#ffe9a0,#c9921f 60%,#8c6512)}
.badge.got .shield span{filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
.badge:not(.got){opacity:.75}
.badge small{color:#7a6248;font-size:.82rem}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card-btn{background:none;border:0;padding:0}
.rcard{position:relative;aspect-ratio:3/4;border-radius:14px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;color:#fff;text-align:center;
  background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.35),transparent 55%),linear-gradient(160deg,var(--fc),var(--fd));border:4px solid #f2c14e;box-shadow:0 5px 0 #2a170a,inset 0 0 0 3px rgba(255,255,255,.25)}
.rcard.locked{background:linear-gradient(160deg,#8f8068,#5b4f3e);border-color:#a89a7c}
.rc-num{position:absolute;top:8px;left:10px;font-family:var(--title);font-weight:900;font-size:1.3rem;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.rc-code{position:absolute;top:10px;right:10px;font-size:.75rem;font-weight:700;background:rgba(0,0,0,.25);border-radius:6px;padding:1px 6px}
.rc-art{font-size:3rem;margin-top:26px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.3))}
.rc-title{font-size:.95rem;line-height:1.2;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.rcard .star{color:rgba(255,255,255,.4)}.rcard .star.on{color:#ffe27a}
.case-closed .rcard{width:170px}
.modal-card{display:flex;justify-content:center;margin-bottom:14px}

.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{padding:.55em 1em;border-radius:12px 12px 0 0;border:3px solid var(--wood-d);border-bottom:0;background:#c7a76a;color:var(--wood-d);font-weight:700}

.codes-table{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}

.ct-fam table{width:100%;border-collapse:collapse;font-size:.95rem}
.ct-fam td{padding:4px 6px;border-bottom:1px solid rgba(138,90,43,.25);vertical-align:middle}

.guide-text h3{color:var(--wood-d);margin:1em 0 .3em}
.guide-text p{margin:.2em 0 .6em;max-width:75ch}
.help-steps{display:flex;flex-direction:column;gap:12px;padding-left:1.4em}
.help-steps p{margin:.2em 0 0}

/* ---------- Toast & modale ---------- */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;max-width:min(92vw,520px);padding:12px 18px;border-radius:12px;
  background:#2a170a;color:#fff;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.45);border:2px solid #7a4a22;animation:rise .25s ease-out;text-align:center}
.toast-gold{background:linear-gradient(#ffe9a0,#f2b93a);color:#4a2b14;border-color:#8c6512}
.toast.out{opacity:0;transition:opacity .4s}
.modal-back{position:fixed;inset:0;z-index:50;background:rgba(10,14,30,.65);display:grid;place-items:center;padding:16px}
.modal{width:min(560px,100%);max-height:88vh;overflow:auto;padding:20px}
.m-title{margin:.1em 0 .5em;color:var(--wood-d)}

/* ---------- Pied ---------- */
footer{text-align:center;color:#c9b88f;font-size:.85rem;padding:20px 10px calc(30px + env(safe-area-inset-bottom,0px))}
footer b{color:var(--gold)}

/* ---------- Animations ---------- */
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes stamp{0%{transform:scale(2) rotate(-10deg);opacity:0}100%{opacity:1}}
@keyframes rise{from{transform:translate(-50%,20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes blink{0%,100%{background:transparent}50%{background:#ffe27a}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- Impression ---------- */
.print-page{background:#fff;color:#111;padding:24px;border-radius:12px}
.print-title{font-family:var(--title);font-size:1.5rem;margin:.3em 0}
.print-table{width:100%;border-collapse:collapse;margin:8px 0 16px;font-size:.92rem}
.print-table th,.print-table td{border:1px solid #999;padding:5px 7px;text-align:left;vertical-align:top}
.print-table th{background:#f1e6cf}
@media print{
  body{background:#fff!important}
  body::after,body::before,.topbar,footer,.no-print,.toast{display:none!important}
  main{padding:0;max-width:none}
  .print-page{padding:0}
  .num-badge,.pill{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (max-width:600px){
  .hero-fb{flex-direction:column;min-height:270px;gap:10px;padding:18px 14px}
  .emblem{width:84px}
  .hero-title{align-items:center;text-align:center}
  .hero-sub{font-size:.95rem}
}

sonnel sujet (quelqu'un, nous) ; « son » est un déterminant possessif (le sien).", "tool": "changer-temps", "toolUse": "Mets à l'imparfait : « Ils avaient fouillé », « Les indices étaient cachés » → ont / sont. Si c'est impossible, c'est on / son. Pour « on », essaie « il » : « Il entend des pas ».", "ex": "On sait qu'ils ont gagné et que son équipe est contente.", "piege": "On n'oublie pas la négation après « on » : « On n'a rien vu » (on peut dire « Il n'a rien vu »).", "note": null, "defis": [{"q": "Les suspects ___ menti.", "a": "ont", "w": ["on"], "why": "« Les suspects avaient menti » : verbe avoir."}, {"q": "___ ne sait pas qui a volé le tableau.", "a": "On", "w": ["Ont"], "why": "« Il ne sait pas » : pronom sujet."}, {"q": "Hugo cherche ___ sac.", "a": "son", "w": ["sont"], "why": "« Hugo cherche le sien » : déterminant possessif."}, {"q": "Les portes ___ verrouillées.", "a": "sont", "w": ["son"], "why": "« Les portes étaient verrouillées » : verbe être."}, {"q": "Les enquêteurs ___ une piste.", "a": "ont", "w": ["on"], "why": "« Ils avaient une piste » : verbe avoir."}, {"q": "Nadia montre ___ badge.", "a": "son", "w": ["sont"], "why": "« Nadia montre le sien » : déterminant possessif."}], "terrain": [{"t": "Ils {on|ont} découvert un passage secret.", "why": "« Ils avaient découvert » : verbe avoir, donc « ont »."}, {"t": "Ses parents {son|sont} inquiets.", "why": "« Ses parents étaient inquiets » : verbe être, donc « sont »."}], "open": false}, {"num": 4, "id": "CES", "fam": "ORTH", "title": "ces / ses / c'est / s'est", "lv": [6, 5], "affaire": "L'affaire des quatre suspects", "q": "Quatre mots se prononcent pareil. Qu'est-ce qui les distingue ?", "groups": ["ces", "ses", "c'est", "s'est"], "corpus": [{"t": "[Ces] traces sont fraîches.", "g": 0}, {"t": "Margot range [ses] crayons.", "g": 1}, {"t": "[C'est] une fausse piste.", "g": 2}, {"t": "Le voleur [s'est] enfui.", "g": 3}, {"t": "Regarde [ces] empreintes !", "g": 0}, {"t": "Il a perdu [ses] clés.", "g" est pas devant un nom ; et dans « il se cache », « se » est devant un verbe."}], "rule": "« se » est un pronom réfléchi placé devant un verbe : en changeant de personne, il devient « me » (je me cache). « ce » est un déterminant démonstratif (ce carnet-là) ou un pronom (ce que, ce qui, c'est). « ça » est un pronom qui signifie « cela ». « sa » est un déterminant possessif (la sienne).", "tool": "remplacer", "toolUse": "« je me cache » → se ; « cela » → ça ; « la sienne » → sa ; « ce carnet-là » → ce.", "ex": "Ce matin, Hugo se lève et prend sa loupe : ça promet !", "piege": "« ça » ne prend pas d'accent sur le a.", "note": null, "defis": [{"q": "Il ___ demande qui a menti.", "a": "se", "w": ["ce"], "why": "« Je me demande » : pronom réfléchi."}, {"q": "___ témoin dit la vérité.", "a": "Ce", "w": ["Se"], "why": "« Ce témoin-là » : démonstratif."}, {"q": "Margot range ___ trousse.", "a": "sa", "w": ["ça"], "why": "« la sienne » : possessif."}, {"q": "Regarde ___ : une empreinte !", "a": "ça", "w": ["sa"], "why": "« Regarde cela » : pronom."}, {"q": "Les chats ___ battent dans la cour.", "a": "se", "w": ["ce"], "why": "« Nous nous battons » : pronom réfléchi."}, {"q": "___ que tu as trouvé est essentiel.", "a": "Ce", "w": ["Se"], "why": "« Ce que » : pronom démonstratif."}], "terrain": [{"t": "Le voleur {ce|se} cache dans la cave.", "why": "« Je me cache » : pronom réfléchi « se »."}, {"t": "{Sa|Ça} ne sert à rien de crier.", "why": "« Cela ne sert à rien » : « ça »."}], "open": false}, {"num": 7, "id": "LEUR", "fam": "ORTH", "title": "leur / leurs", "lv": [5, 4], "affaire": "L'affaire du s disparu", "q": "Pourquoi « leur » prend-il parfois un s, parfois non ?", "groups": ["leur (sans s)", "leurs (avec s)"], "corpus": [{"t": "Je [leur] parle.", "g": 0}, {"t": "Ils prennent [leurs] sacs.", "g": 1}, {"t": "Les enquêteurs ont perdu [leur] chien.", "g": 0}, {"t": "Je [leur] ai donné la carte.", "g": 0}, {"t": "Elles montrent [leurs] badges.", "g": 1}, {"t": "Les témoins et [leurs] familles attendent.", "g": 1}], "hyps": [{"t": "« leur » s'emploie quand il y a une personne, « leurs » quand il y en a plusieurs.", "ok": false, "r": "Contre-exemple : « Les enquêteurs ont perdu leur chien » — plusieurs enquêteurs, mais pas de s : un seul chien."}, {"t": "Devant un verbe, « leur » est un pronom (= à eux) et ne prend jamais de s ; devant un nom, il s'accorde avec ce nom.", "ok": true, "r": ""}, {"t": "« leurs » prend un s quand le verbe est au pluriel.", "ok": false, "r": "Contre-exemple : « Je leur parle » et « Ils prennent leurs sacs » — c'est le nom « sacs » qui commande, pas le verbe."}], "rule": "Devant un verbe, « leur » est un pronom personnel (= à eux, à elles) : il est invariable. Devant un nom, « leur » est un déterminant possessif : il s'accorde avec le nom (leur chien, leurs sacs).", "tool": "remplacer", "toolUse": "Remplace par « lui » : « Je lui parle » fonctionne → pronom, pas de s. Devant un nom, regarde si ce nom est au singulier ou au pluriel.", "ex": "Je leur ai rendu leurs cahiers et leur trousse.", "piege": "« leurs » sans nom après n'existe que dans « les leurs ».", "note": null, "defis": [{"q": "Les élèves rangent ___ affaires.", "a": "leurs", "w": ["leur"], "why": "« affaires » est pluriel : le déterminant s'accorde."}, {"q": "Je ___ ai expliqué le plan.", "a": "leur", "w": ["leurs"], "why": "« Je lui ai expliqué » : pronom invariable."}, {"q": "Les détectives ont garé ___ voiture.", "a": "leur", "w": ["leurs"], "why": "Une seule voiture : singulier."}, {"q": "Dis-___ de venir vite.", "a": "leur", "w": ["leurs"], "why": "« Dis-lui » : pronom invariable."}, {"q": "Les voisins ont fermé ___ volets.", "a": "leurs", "w": ["leur"], "why": "« volets » est pluriel."}, {"q": "Nous ___ envoyons un message codé.", "a": "leur", "w": ["leurs"], "why": "« Nous lui envoyons » : pronom."}], "terrain": [{"t": "Je {leurs|leur} ai montré la photo.", "why": "Devant un verbe, « leur » est un pronom : jamais de s."}, {"t": "Les enfants ont oublié {leur|leurs} cartables.", "why": "« cartables » est pluriel : « leurs »."}], "open": false}, {"num": 8, "id": "ER", "fam": "ORTH", "title": "-é / -er / -ez", "lv": [6, 5, 4], "affaire": "L'affaire des trois terminaisons", "q": "Même son [e] à la fin du verbe : comment choisir la terminaison ?", "groups": ["-er", "-é(e)(s)", "-ez"], "corpus": [{"t": "Il faut [chercher] la clé.", "g": 0}, {"t": "Elle a [cherché] partout.", "g": 1}, {"t": "Vous [cherchez] encore ?", "g": 2}, {"t": "Je vais [interroger] le témoin.", "g": 0}, {"t": "Le témoin a été [interrogé].", "g": 1}, {"t": "[Écoutez] bien ce bruit.", "g": 2}], "hyps": [{"t": "Si on peut remplacer par « vendre », c'est -er ; par « vendu », c'est -é ; avec « vous », c'est -ez.", "ok": true, "r": ""}, {"t": "Après « a », on écrit toujours -er.", "ok": false, "r": "Contre-exemple : « Elle a cherché » — après l'auxiliaire « a », on écrit -é."}, {"t": "On écrit -er quand le mot est en fin de phrase.", "ok": false, "r": "Contre-exemple : « Le témoin a été interrogé. » — fin de phrase, mais -é."}], "rule": "Infinitif en -er : on peut le remplacer par « vendre » ou « prendre » (souvent après une préposition ou un autre verbe). Participe passé en -é : on peut le remplacer par « vendu » ou « pris » (après avoir ou être, ou comme adjectif ; il peut s'accorder : -ée, -és, -ées). Terminaison -ez : verbe conjugué avec « vous ».", "tool": "remplacer", "toolUse": "Remplace par un verbe du 3e groupe : « Il faut vendre » → -er ; « Elle a vendu » → -é.", "ex": "Vous allez chercher le coffre que Léo a caché.", "piege": "Après une préposition (à, de, pour, sans), le verbe est à l'infinitif : « sans parler ».", "note": null, "defis": [{"q": "Nous devons ___ le bureau.", "a": "ranger", "w": ["rangé", "rangez"], "why": "« Nous devons prendre » : infinitif."}, {"q": "Le coffre a été ___ hier.", "a": "forcé", "w": ["forcer", "forcez"], "why": "« a été pris » : participe passé."}, {"q": "Vous ___ trop vite !", "a": "marchez", "w": ["marcher", "marché"], "why": "Avec « vous » : -ez."}, {"q": "Il est parti sans ___.", "a": "parler", "w": ["parlé", "parlez"], "why": "Après « sans » : infinitif (« sans prendre »)."}, {"q": "La lettre ___ par Hugo est illisible.", "a": "envoyée", "w": ["envoyer", "envoyez"], "why": "« La lettre prise par Hugo » : participe passé, accordé au féminin."}, {"q": "Je l'ai vu ___ par la fenêtre.", "a": "sauter", "w": ["sauté", "sautez"], "why": "« Je l'ai vu prendre » : infinitif après « voir »."}], "terrain": [{"t": "Il a {oublier|oublié} son carnet.", "why": "« Il a pris » : participe passé « oublié »."}, {"t": "Nous allons {visité|visiter} le manoir.", "why": "« Nous allons prendre » : infinitif « visiter »."}], "open": false}, {"num": 9, "id": "LEX", "fam": "ORTH", "title": "Orthographe lexicale", "lv": [6, 5, 4, 3], "affaire": "L'affaire des lettres muettes", "q": "Comment deviner une lettre qu'on n'entend pas à la fin d'un mot ?", "groups": ["finit par -d", "finit par -t", "finit par -s"], "corpus": [{"t": "Le château est très [grand].", "g": 0}, {"t": "Il fait [froid] ce soir.", "g": 0}, {"t": "Ce couloir est [étroit].", "g": 1}, {"t": "Un [chat] miaule.", "g": 1}, {"t": "Le ciel est [gris].", "g": 2}, {"t": "Il marche à [pas] lents.", "g": 2}], "hyps": [{"t": "La lettre muette se devine grâce à un mot de la même famille ou au féminin.", "ok": true, "r": ""}, {"t": "Les mots qui finissent par le son [a] s'écrivent toujours -at.", "ok": false, "r": "Contre-exemple : « pas » s'écrit -as (« passer »)."}, {"t": "La lettre muette finale est presque toujours un -e.", "ok": false, "r": "Contre-exemple : « grand », « étroit », « gris » : la lettre muette est d, t ou s."}], "rule": "Beaucoup de mots se terminent par une lettre qu'on n'entend pas. Pour la trouver, on cherche un mot de la même famille (grand → grandir) ou le féminin (gris → grise). La famille aide aussi pour les accents et les consonnes doubles, avec quelques exceptions à vérifier dans le dictionnaire.", "tool": "famille", "toolUse": "Cherche un mot de la même famille : « froid » → « froideur » ; « chat » → « chaton ».", "ex": "Un grand chat gris dort au chaud.", "piege": "Quelques exceptions : « abri » (abriter), « favori » (favorite)… Le dictionnaire tranche.", "note": "Rectifications de 1990 (référence des nouveaux programmes) : l'accent circonflexe devient facultatif sur i et u (connaitre ou connaître, chaine ou chaîne), sauf quand il distingue deux mots (mûr / mur, sûr / sur, dû) et dans les terminaisons verbales du passé simple et du subjonctif (nous fûmes, qu'il fût).", "defis": [{"q": "Le sol est ___ : attention !", "a": "glissant", "w": ["glissan", "glissand"], "why": "Féminin « glissante » → -t."}, {"q": "On entend un ___ étrange.", "a": "bruit", "w": ["brui", "bruis"], "why": "Famille : « bruiter, bruitage » → -t."}, {"q": "Ce sac est trop ___.", "a": "lourd", "w": ["lour", "lours"], "why": "Féminin « lourde » → -d."}, {"q": "Le chemin est ___.", "a": "long", "w": ["lon", "lont"], "why": "Féminin « longue », « longueur » → -g."}, {"q": "Le ___ de la forêt est sombre.", "a": "bois", "w": ["boi", "boit"], "why": "« boisé, boiserie » → -s."}, {"q": "Il parle avec un ___ du Sud.", "a": "accent", "w": ["accen", "accend"], "why": "Famille « accentuer » → -t."}], "terrain": [{"t": "Il fait très {froit|froid} dans la cave.", "why": "« froideur », « froide » → -d."}, {"t": "Le couloir est {étroi|étroit}.", "why": "Féminin « étroite » → -t."}], "open": false}, {"num": 10, "id": "SV", "fam": "ACC", "title": "Accord sujet-verbe", "lv": [6, 5, 4, 3], "affaire": "L'affaire du chef introuvable", "q": "Avec quel mot le verbe s'accorde-t-il vraiment ?", "groups": ["verbe au singulier", "verbe au pluriel"], "corpus": [{"t": "Le chien des voisins [aboie].", "g": 0}, {"t": "Les témoins du vol [mentent].", "g": 1}, {"t": "Les clés que j'ai perdues [sont] ici.", "g": 1}, {"t": "Dans le grenier [dormait] un vieux chat.", "g": 0}, {"t": "C'est moi qui [ai] la carte.", "g": 0}, {"t": "Hugo et Nadia [cherchent] la sortie.", "g": 1}], "hyps": [{"t": "Le verbe s'accorde avec le nom placé juste avant lui.", "ok": false, "r": "Contre-exemple : « Le chien des voisins aboie » — le nom juste avant est « voisins » (pluriel), mais le verbe est au singulier."}, {"t": "Le verbe s'accorde avec son sujet, qu'on trouve avec « c'est… qui », même s'il est loin ou placé après le verbe.", "ok": true, "r": ""}, {"t": "Le sujet est toujours placé avant le verbe.", "ok": false, "r": "Contre-exemple : « Dans le grenier dormait un vieux chat » — le sujet « un vieux chat » est après le verbe."}], "rule": "Le verbe s'accorde en personne et en nombre avec son sujet. Le sujet peut être éloigné du verbe, placé après lui (inversion), ou être le pronom « qui » : le verbe s'accorde alors avec le mot que « qui » remplace. Plusieurs sujets coordonnés donnent un verbe au pluriel.", "tool": "encadrer", "toolUse": "Encadre avec « c'est… qui » : « C'est le chien des voisins qui aboie » → le sujet est « le chien », singulier.", "ex": "Les feuilles que le vent emporte tourbillonnent.", "piege": "Le pronom « les » ou « leur » placé devant le verbe n'est pas le sujet : « Il les regarde ».", "note": null, "defis": [{"q": "Les traces de pas ___ vers la forêt.", "a": "mènent", "w": ["mène", "mènes"], "why": "Sujet : « les traces » (pluriel)."}, {"q": "La boîte de crayons ___ tombée.", "a": "est", "w": ["sont", "es"], "why": "Sujet : « la boîte » (singulier)."}, {"q": "C'est toi qui ___ raison.", "a": "as", "w": ["a", "ont"], "why": "« qui » reprend « toi » : 2e personne."}, {"q": "Au loin ___ deux silhouettes.", "a": "apparaissent", "w": ["apparaît", "apparais"], "why": "Sujet inversé : « deux silhouettes »."}, {"q": "Margot et moi ___ la porte.", "a": "ouvrons", "w": ["ouvre", "ouvrent"], "why": "« Margot et moi » = nous."}, {"q": "Je les ___ souvent au parc.", "a": "vois", "w": ["voient", "voit"], "why": "Sujet : « je » ; « les » est COD."}], "terrain": [{"t": "Les élèves de la classe {prépare|préparent} une enquête.", "why": "Sujet : « les élèves » (pluriel)."}, {"t": "Le bruit des vagues {couvrent|couvre} nos voix.", "why": "Sujet : « le bruit » (singulier)."}], "open": false}, {"num": 11, "id": "GN", "fam": "ACC", "title": "Accords dans le groupe nominal", "lv": [6, 5, 4, 3], "affaire": "L'affaire de la bande des accords", "q": "Avec quoi l'adjectif s'accorde-t-il, et comment se forme le pluriel ?", "groups": ["masculin pluriel", "féminin pluriel"], "corpus": [{"t": "des indices [précieux]", "g": 0}, {"t": "des pistes [sérieuses]", "g": 1}, {"t": "des chevaux [noirs]", "g": 0}, {"t": "des fenêtres [ouvertes]", "g": 1}, {"t": "une boîte et une clé [rouillées]", "g": 1}, {"t": "un manteau et une écharpe [noirs]", "g": 0}], "hyps": [{"t": "L'adjectif s'accorde en genre et en nombre avec le ou les noms qu'il qualifie ; avec un nom masculin et un nom féminin, il se met au masculin pluriel.", "ok": true, "r": ""}, {"t": "L'adjectif s'accorde avec le dernier nom écrit.", "ok": false, "r": "Contre-exemple : « un manteau et une écharpe noirs » — le dernier nom est féminin, mais l'adjectif est au masculin pluriel."}, {"t": "Le pluriel se fait toujours en ajoutant -s.", "ok": false, "r": "Contre-exemple : « des chevaux », « des indices précieux » — pluriel en -aux, et -x déjà présent."}], "rule": "Dans le groupe nominal, le déterminant, le nom et l'adjectif s'accordent en genre et en nombre. Si l'adjectif qualifie un nom masculin et un nom féminin, il se met au masculin pluriel. Certains noms et adjectifs ont un pluriel particulier : -al → -aux (cheval, journal), -eau → -eaux, -eu → -eux (sauf pneus, bleus).", "tool": "changer-nombre", "toolUse": "Change le nombre : « un indice précieux » → « des indices précieux ». Repère le nom noyau : il commande tous les mots de son groupe.", "ex": "De vieilles lanternes rouillées éclairent les hauts murs.", "piege": "Les mots en -s, -x ou -z ne changent pas au pluriel : un nez, des nez.", "note": null, "defis": [{"q": "Des histoires ___ circulent.", "a": "étranges", "w": ["étrange", "étranger"], "why": "« histoires » est pluriel."}, {"q": "Les ___ du village sont fermés.", "a": "bureaux", "w": ["bureaus", "bureau"], "why": "-eau → -eaux."}, {"q": "Une veste et un chapeau ___.", "a": "noirs", "w": ["noires", "noir"], "why": "Masculin + féminin → masculin pluriel."}, {"q": "Les témoins ___ se taisent.", "a": "principaux", "w": ["principals", "principales"], "why": "-al → -aux au masculin pluriel."}, {"q": "Elle porte des bottes ___.", "a": "neuves", "w": ["neufs", "neuve"], "why": "« bottes » : féminin pluriel."}, {"q": "Des pneus ___ traînent dans la cour.", "a": "usés", "w": ["usées", "usé"], "why": "« pneus » : masculin pluriel."}], "terrain": [{"t": "Ils ont trouvé des lettres {ancien|anciennes}.", "why": "« lettres » est féminin pluriel : « anciennes »."}, {"t": "Les {animals|animaux} du zoo dorment.", "why": "-al → -aux : « animaux »."}], "open": false}, {"num": 12, "id": "PPE", "fam": "ACC", "title": "Participe passé avec être", "lv": [6, 5], "affaire": "L'affaire des voyageuses", "q": "Quand le participe passé s'accorde-t-il avec le sujet ?", "groups": ["accordé avec le sujet", "pas accordé avec le sujet"], "corpus": [{"t": "Elles sont [arrivées] tôt.", "g": 0}, {"t": "Elles ont [mangé] tôt.", "g": 1}, {"t": "Nadia est [partie].", "g": 0}, {"t": "Nadia a [parlé].", "g": 1}, {"t": "Les garçons sont [tombés].", "g": 0}, {"t": "Les garçons ont [couru].", "g": 1}], "hyps": [{"t": "Le participe passé s'accorde toujours avec le sujet.", "ok": false, "r": "Contre-exemple : « Elles ont mangé » — le sujet est féminin pluriel, pourtant pas d'accord."}, {"t": "Avec l'auxiliaire être, le participe s'accorde avec le sujet ; avec avoir, jamais avec le sujet.", "ok": true, "r": ""}, {"t": "Le participe s'accorde quand le sujet est féminin.", "ok": false, "r": "Contre-exemple : « Les garçons sont tombés » — masculin, et pourtant accord ; « Nadia a parlé » — féminin, sans accord."}], "rule": "Avec l'auxiliaire être, le participe passé s'accorde en genre et en nombre avec le sujet, comme un adjectif. Avec avoir, il ne s'accorde jamais avec le sujet (voir le code 13).", "tool": "remplacer", "toolUse": "Remplace par un adjectif : « Elles sont arrivées » comme « Elles sont contentes » → accord avec le sujet.", "ex": "Les invitées sont venues ; elles ont dansé.", "piege": "Avec « on » qui veut dire « nous », l'accord est admis : « On est partis ».", "note": null, "defis": [{"q": "Les filles sont ___ tard.", "a": "rentrées", "w": ["rentré", "rentrés"], "why": "Être : accord avec « les filles » (féminin pluriel)."}, {"q": "Hugo est ___ du train.", "a": "descendu", "w": ["descendue", "descendus"], "why": "Être : accord avec « Hugo » (masculin singulier)."}, {"q": "Elles ont ___ toute la nuit.", "a": "marché", "w": ["marchées", "marchés"], "why": "Avoir : pas d'accord avec le sujet."}, {"q": "La porte est ___ toute seule.", "a": "tombée", "w": ["tombé", "tombés"], "why": "Être : accord avec « la porte »."}, {"q": "Nos amis sont ___ en vacances.", "a": "partis", "w": ["parti", "parties"], "why": "Être : masculin pluriel."}, {"q": "Margot et Nadia sont ___ au musée.", "a": "allées", "w": ["allés", "allé"], "why": "Être : féminin pluriel."}], "terrain": [{"t": "Hier, nous sommes {allé|allés/allées} au château.", "why": "Être : accord avec « nous » (pluriel)."}, {"t": "Ma sœur est {né|née} en mai.", "why": "Être : accord avec « ma sœur » (féminin)."}], "open": false}, {"num": 13, "id": "PPA", "fam": "ACC", "title": "Participe passé avec avoir", "lv": [5, 4, 3], "affaire": "L'affaire du participe qui change de costume", "q": "Avec avoir, pourquoi le participe s'accorde-t-il seulement dans certaines phrases ?", "groups": ["participe accordé", "participe non accordé"], "corpus": [{"t": "Elle a [écrit] des lettres.", "g": 1}, {"t": "Les lettres qu'elle a [écrites].", "g": 0}, {"t": "Il a [mangé] la pomme.", "g": 1}, {"t": "La pomme qu'il a [mangée].", "g": 0}, {"t": "Les filles ont [couru].", "g": 1}, {"t": "Nos amis, nous les avons [vus].", "g": 0}], "hyps": [{"t": "Il s'accorde avec le sujet.", "ok": false, "r": "Contre-exemple : « Les filles ont couru » — sujet féminin pluriel, et pourtant pas d'accord."}, {"t": "Il s'accorde quand un mot est placé avant le verbe.", "ok": false, "r": "Contre-exemple : « Les filles ont couru » — « les filles » est avant, mais pas d'accord. Ce n'est pas n'importe quel mot qui compte."}, {"t": "Il s'accorde avec le COD (réponse à « quoi ? » ou « qui ? ») seulement si ce COD est placé avant le verbe.", "ok": true, "r": ""}], "rule": "Avec l'auxiliaire avoir, le participe passé ne s'accorde jamais avec le sujet. Il s'accorde avec le COD si celui-ci est placé avant le verbe (souvent un pronom : que, l', la, les). Si le COD est après, ou s'il n'y en a pas : pas d'accord.", "tool": "questionner", "toolUse": "Pose la question « quoi ? » ou « qui ? » après le verbe : « Elle a écrit quoi ? Des lettres » (placé après → pas d'accord). Dans « les lettres qu'elle a écrites », « qu' » = les lettres, placé avant → accord.", "ex": "Ces photos, je les ai prises hier ; j'ai pris d'autres photos aujourd'hui.", "piege": "Le pronom « en » ne provoque pas l'accord : « Des pommes, j'en ai mangé ».", "note": "Rectifications de 1990 : « laissé » suivi d'un infinitif reste invariable (« Elle s'est laissé surprendre »).", "defis": [{"q": "Les clés que j'ai ___ sont ici.", "a": "perdues", "w": ["perdu", "perdus"], "why": "COD « que » (= les clés, féminin pluriel) placé avant : accord."}, {"q": "J'ai ___ les clés.", "a": "perdu", "w": ["perdues", "perdus"], "why": "COD « les clés » après le verbe : pas d'accord."}, {"q": "Cette histoire, il l'a ___ cent fois.", "a": "racontée", "w": ["raconté", "racontés"], "why": "COD « l' » (= cette histoire) placé avant : accord au féminin."}, {"q": "Elles ont ___ toute la journée.", "a": "travaillé", "w": ["travaillées", "travaillés"], "why": "Pas de COD : pas d'accord."}, {"q": "Quels indices as-tu ___ ?", "a": "trouvés", "w": ["trouvé", "trouvées"], "why": "COD « quels indices » placé avant : masculin pluriel."}, {"q": "Des fraises ? J'en ai ___.", "a": "cueilli", "w": ["cueillies", "cueillis"], "why": "« en » ne provoque pas l'accord."}], "terrain": [{"t": "Les photos que tu as {pris|prises} sont floues.", "why": "COD « que » (= les photos) placé avant : « prises »."}, {"t": "Elle a {mangée|mangé} une pomme.", "why": "COD « une pomme » après le verbe : pas d'accord."}], "open": false}, {"num": 14, "id": "PRO", "fam": "ACC", "title": "Participe passé des verbes pronominaux", "lv": [3], "affaire": "L'affaire du miroir double", "q": "Elles se sont « lavées » ou « lavé » ? Qu'est-ce qui décide ?", "groups": ["participe accordé", "participe non accordé"], "corpus": [{"t": "Elles se sont [lavées].", "g": 0}, {"t": "Elles se sont [lavé] les mains.", "g": 1}, {"t": "Ils se sont [regardés].", "g": 0}, {"t": "Ils se sont [parlé].", "g": 1}, {"t": "Elle s'est [évanouie].", "g": 0}, {"t": "Elle s'est [coupé] le doigt.", "g": 1}], "hyps": [{"t": "Comme avec être, on accorde toujours avec le sujet.", "ok": false, "r": "Contre-exemple : « Elles se sont lavé les mains » — sujet féminin pluriel, et pourtant pas d'accord."}, {"t": "On remplace « être » par « avoir » et on cherche le COD : on accorde s'il est placé avant (souvent « se »). Les verbes toujours pronominaux (s'évanouir) s'accordent avec le sujet.", "ok": true, "r": ""}, {"t": "On n'accorde jamais les verbes pronominaux.", "ok": false, "r": "Contre-exemple : « Elles se sont lavées » — le participe est accordé."}], "rule": "Pour la plupart des verbes pronominaux, on remplace mentalement « être » par « avoir » : le participe s'accorde avec le COD placé avant. « Elles se sont lavées » (elles ont lavé qui ? se = elles → accord). « Elles se sont lavé les mains » (COD « les mains » après → pas d'accord). « Ils se sont parlé » (parler à quelqu'un : se est COI → pas d'accord). Les verbes toujours pronominaux (s'évanouir, se souvenir, s'enfuir) s'accordent avec le sujet.", "tool": "questionner", "toolUse": "Remplace être par avoir et pose la question : « Elle a coupé quoi ? Le doigt » (placé après → pas d'accord).", "ex": "Ils se sont serré la main, puis ils se sont quittés.", "piege": "Avec se parler, se sourire, se téléphoner, se succéder, « se » est COI : jamais d'accord.", "note": null, "defis": [{"q": "Elles se sont ___ les cheveux.", "a": "coiffé", "w": ["coiffées", "coiffés"], "why": "COD « les cheveux » après : pas d'accord."}, {"q": "Elles se sont ___ devant le miroir.", "a": "coiffées", "w": ["coiffé", "coiffés"], "why": "COD « se » (= elles) placé avant : accord."}, {"q": "Nos voisins se sont ___ au téléphone.", "a": "parlé", "w": ["parlés", "parlées"], "why": "Parler à quelqu'un : « se » est COI, pas d'accord."}, {"q": "La suspecte s'est ___ par la fenêtre.", "a": "enfuie", "w": ["enfui", "enfuis"], "why": "Verbe toujours pronominal : accord avec le sujet."}, {"q": "Ils se sont ___ des cadeaux.", "a": "offert", "w": ["offerts", "offertes"], "why": "COD « des cadeaux » après : pas d'accord."}, {"q": "Les deux témoins se sont ___.", "a": "disputés", "w": ["disputé", "disputées"], "why": "Accord avec le sujet (masculin pluriel)."}], "terrain": [{"t": "Elle s'est {lavée|lavé} les mains.", "why": "COD « les mains » après le verbe : pas d'accord."}, {"t": "Les deux amies se sont {téléphonées|téléphoné}.", "why": "Téléphoner à quelqu'un : « se » est COI, pas d'accord."}], "open": false}, {"num": 15, "id": "ATT", "fam": "ACC", "title": "Accord de l'attribut du sujet", "lv": [6, 5], "affaire": "L'affaire des apparences", "q": "Pourquoi certains mots placés après le verbe s'accordent-ils avec le sujet ?", "groups": ["attribut (accordé avec le sujet)", "complément (aucun accord)"], "corpus": [{"t": "Les filles semblent [fatiguées].", "g": 0}, {"t": "Les filles cherchent [un indice].", "g": 1}, {"t": "La maison paraît [abandonnée].", "g": 0}, {"t": "Les nuits deviennent [froides].", "g": 0}, {"t": "La maison abrite [un secret].", "g": 1}, {"t": "Ces témoins restent [muets].", "g": 0}], "hyps": [{"t": "Après un verbe d'état (être, sembler, paraître, devenir, rester, avoir l'air), l'adjectif est attribut du sujet et s'accorde avec lui.", "ok": true, "r": ""}, {"t": "Tout mot placé après le verbe s'accorde avec le sujet.", "ok": false, "r": "Contre-exemple : « Les filles cherchent un indice » — « un indice » ne s'accorde pas avec « les filles »."}, {"t": "L'adjectif s'accorde seulement après le verbe être.", "ok": false, "r": "Contre-exemple : « Les nuits deviennent froides » — verbe devenir, et pourtant accord."}], "rule": "L'attribut du sujet exprime une qualité du sujet par l'intermédiaire d'un verbe d'état (être, paraître, sembler, devenir, demeurer, rester, avoir l'air…). L'adjectif attribut s'accorde en genre et en nombre avec le sujet.", "tool": "remplacer", "toolUse": "Remplace le verbe par « être » : « Les nuits deviennent froides » → « Les nuits sont froides » : le sens tient → attribut.", "ex": "Les rues restent désertes et semblent hostiles.", "piege": "Avec « avoir l'air », l'accord se fait le plus souvent avec le sujet : « Elle a l'air contente ».", "note": null, "defis": [{"q": "Ces énigmes paraissent ___.", "a": "impossibles", "w": ["impossible"], "why": "Attribut de « ces énigmes » (pluriel)."}, {"q": "La rue devient ___ le soir.", "a": "silencieuse", "w": ["silencieux", "silencieuses"], "why": "Attribut de « la rue » (féminin singulier)."}, {"q": "Nadia et Margot semblent ___.", "a": "inquiètes", "w": ["inquiet", "inquiets"], "why": "Attribut de « Nadia et Margot » (féminin pluriel)."}, {"q": "Ces portes demeurent ___.", "a": "closes", "w": ["clos", "close"], "why": "Attribut de « ces portes » (féminin pluriel)."}, {"q": "Les murs sont ___.", "a": "humides", "w": ["humide"], "why": "Attribut de « les murs » (pluriel)."}, {"q": "Elle a l'air ___.", "a": "surprise", "w": ["surpris"], "why": "Accord avec le sujet « elle »."}], "terrain": [{"t": "Les fenêtres semblent {ouvert|ouvertes}.", "why": "Attribut du sujet « les fenêtres » : féminin pluriel."}, {"t": "Cette maison est {abandonné|abandonnée}.", "why": "Attribut de « cette maison » : féminin."}], "open": false}, {"num": 16, "id": "TOUT", "fam": "ACC", "title": "tout, même, couleurs, nombres", "lv": [4, 3], "affaire": "L'affaire des mots caméléons", "q": "Ces mots s'accordent parfois, et parfois non. Quelle est la règle cachée ?", "groups": ["variable (accordé)", "invariable"], "corpus": [{"t": "[Tous] les témoins mentent.", "g": 0}, {"t": "Elles sont [tout] émues.", "g": 1}, {"t": "des robes [bleues]", "g": 0}, {"t": "des robes [bleu clair]", "g": 1}, {"t": "quatre-[vingts] ans", "g": 0}, {"t": "quatre-[vingt]-dix ans", "g": 1}], "hyps": [{"t": "Ces mots se mettent toujours au pluriel quand le nom est pluriel.", "ok": false, "r": "Contre-exemple : « des robes bleu clair » — pas d'accord."}, {"t": "Ils s'accordent quand ils accompagnent un nom comme déterminant ou adjectif simple ; ils restent invariables quand « tout » veut dire « tout à fait », quand la couleur est composée, ou quand « vingt » est suivi d'un autre nombre.", "ok": true, "r": ""}, {"t": "Ils sont invariables après une préposition.", "ok": false, "r": "Contre-exemple : « avec tous les témoins » — « tous » s'accorde."}], "rule": "« tout » s'accorde devant un nom (tous les, toutes les). Adverbe (= tout à fait), il est invariable, sauf devant un adjectif féminin commençant par une consonne ou un h aspiré (elles sont toutes rouges). « même » s'accorde quand il signifie « identique » (les mêmes) ; adverbe (= aussi), il est invariable. Les adjectifs de couleur s'accordent, sauf s'ils sont composés (bleu clair) ou viennent d'un nom (marron, orange). « vingt » et « cent » prennent un s s'ils sont multipliés et terminent le nombre (quatre-vingts, deux cents, mais deux cent trois).", "tool": "remplacer", "toolUse": "Remplace « tout » par « tout à fait » : « Elles sont tout à fait émues » → adverbe, invariable.", "ex": "Toutes les vitrines, même les plus vieilles, sont tout illuminées de bougies orange.", "piege": "« mille » est toujours invariable : deux mille.", "note": "Rectifications de 1990 : on peut relier par des traits d'union tous les éléments d'un nombre composé (deux-cent-trois, vingt-et-un).", "defis": [{"q": "___ les fenêtres sont ouvertes.", "a": "Toutes", "w": ["Tout", "Tous"], "why": "Devant un nom féminin pluriel : « toutes »."}, {"q": "Elles sont ___ étonnées.", "a": "tout", "w": ["toutes", "tous"], "why": "« tout à fait » étonnées, devant une voyelle : invariable."}, {"q": "Elle porte des chaussures ___.", "a": "marron", "w": ["marrons", "marronnes"], "why": "Couleur qui vient d'un nom (un marron) : invariable."}, {"q": "Il a ___ euros.", "a": "quatre-vingts", "w": ["quatre-vingt"], "why": "« vingt » multiplié et en fin de nombre : -s."}, {"q": "Ils ont les ___ chaussures.", "a": "mêmes", "w": ["même"], "why": "« identiques » : adjectif, accord."}, {"q": "Des yeux ___.", "a": "vert foncé", "w": ["verts foncés", "verts foncé"], "why": "Couleur composée : invariable."}], "terrain": [{"t": "Elle a {quatre-vingt|quatre-vingts} ans.", "why": "« vingt » multiplié et en fin de nombre prend un s."}, {"t": "{Tout|Toutes} les portes étaient fermées.", "why": "Devant « les portes » (féminin pluriel) : « toutes »."}], "open": false}, {"num": 17, "id": "PRES", "fam": "CONJ", "title": "Le présent", "lv": [6], "affaire": "L'affaire des terminaisons du présent", "q": "Pourquoi « je cherche » sans s, mais « je finis » avec un s ?", "groups": ["terminaisons -e, -es, -e", "terminaisons -s, -s, -t (ou -d)"], "corpus": [{"t": "Je [cherche] la clé.", "g": 0}, {"t": "Je [finis] mon carnet.", "g": 1}, {"t": "Tu [regardes] dehors.", "g": 0}, {"t": "Il [prend] sa loupe.", "g": 1}, {"t": "Elle [marche] vite.", "g": 0}, {"t": "Il [voit] une ombre.", "g": 1}], "hyps": [{"t": "Les verbes en -er prennent -e, -es, -e ; la plupart des autres prennent -s, -s, -t (-d pour les verbes en -dre).", "ok": true, "r": ""}, {"t": "La terminaison dépend seulement du sujet : -s avec je, -t avec il.", "ok": false, "r": "Contre-exemple : « Je cherche » sans -s et « Il prend » sans -t : le sujet ne suffit pas."}, {"t": "Tous les verbes prennent -s avec tu, donc aussi avec je.", "ok": false, "r": "Contre-exemple : « Je cherche » : pas de -s avec je pour les verbes en -er."}], "rule": "Au présent, les verbes du 1er groupe (-er) prennent -e, -es, -e, -ons, -ez, -ent. La plupart des autres verbes prennent -s, -s, -t, -ons, -ez, -ent (finir : je finis, il finit). Les verbes en -dre gardent le d (il prend, il répond), sauf ceux en -indre et -soudre (il peint, il résout). Quelques verbes sont à connaître par cœur : être, avoir, aller, faire, dire, pouvoir, vouloir (je peux, je veux).", "tool": "changer-personne", "toolUse": "Passe à « nous » : « nous cherchons » → verbe en -er, donc -e avec je et il.", "ex": "Je cours, tu ris, il répond, elle chante.", "piege": "Verbes en -cer et -ger : nous commençons, nous mangeons (on garde le son).", "note": null, "defis": [{"q": "Tu ___ la vérité. (dire)", "a": "dis", "w": ["dit", "dies"], "why": "Dire : tu dis."}, {"q": "Il ___ la lettre. (prendre)", "a": "prend", "w": ["prends", "prent"], "why": "Verbe en -dre : il prend."}, {"q": "Je ___ mes notes. (relire)", "a": "relis", "w": ["relit", "relie"], "why": "3e groupe : je relis."}, {"q": "Nous ___ les indices. (ranger)", "a": "rangeons", "w": ["rangons", "rangeont"], "why": "-ger : on garde le e pour le son [ʒ]."}, {"q": "Elle ___ la porte. (peindre)", "a": "peint", "w": ["peind", "peinds"], "why": "Verbes en -indre : il peint, sans d."}, {"q": "Je ___ rester. (pouvoir)", "a": "peux", "w": ["peut", "peus"], "why": "Pouvoir : je peux."}], "terrain": [{"t": "Il {répont|répond} au téléphone.", "why": "Verbe en -dre : il répond."}, {"t": "Tu {cherche|cherches} la clé.", "why": "Avec « tu » : -es."}], "open": false}, {"num": 18, "id": "IMPPS", "fam": "CONJ", "title": "Imparfait ou passé simple", "lv": [6, 5], "affaire": "L'affaire du décor et de l'action", "q": "Dans un récit au passé, pourquoi deux temps différents ?", "groups": ["imparfait", "passé simple"], "corpus": [{"t": "Il [pleuvait] sur le manoir.", "g": 0}, {"t": "Soudain, la porte [claqua].", "g": 1}, {"t": "Chaque soir, le gardien [fermait] les grilles.", "g": 0}, {"t": "Margot [ouvrit] le coffre.", "g": 1}, {"t": "La lune [brillait].", "g": 0}, {"t": "Un cri [retentit].", "g": 1}], "hyps": [{"t": "L'imparfait décrit le décor ou une habitude ; le passé simple raconte les actions principales, ponctuelles, qui font avancer le récit.", "ok": true, "r": ""}, {"t": "L'imparfait sert pour les actions très anciennes, le passé simple pour les actions récentes.", "ok": false, "r": "Contre-exemple : « Il pleuvait » et « la porte claqua » se passent au même moment du récit."}, {"t": "Le passé simple s'emploie seulement après « soudain ».", "ok": false, "r": "Contre-exemple : « Margot ouvrit le coffre » — pas de « soudain », mais passé simple."}], "rule": "Dans un récit au passé, l'imparfait présente l'arrière-plan : description, actions qui durent ou se répètent (-ais, -ais, -ait, -ions, -iez, -aient). Le passé simple présente le premier plan : actions brèves, successives, qui font avancer l'histoire (verbes en -er : -ai, -as, -a, -âmes, -âtes, -èrent ; autres verbes : -is ou -us, -it ou -ut…).", "tool": "changer-temps", "toolUse": "Demande-toi : est-ce le décor (ça dure) ou un événement (ça arrive) ? Essaie d'ajouter « soudain » : si la phrase tient, passé simple.", "ex": "Il faisait nuit. Tout à coup, Hugo entendit un bruit et alluma sa lampe.", "piege": "Il chanta (passé simple) / il chantait (imparfait) : au passé simple, les verbes en -er n'ont pas de -t à la 3e personne.", "note": null, "defis": [{"q": "Le vent ___ depuis des heures quand on frappa.", "a": "soufflait", "w": ["souffla"], "why": "Action qui dure : imparfait."}, {"q": "Tout à coup, Nadia ___ un cri.", "a": "poussa", "w": ["poussait"], "why": "Événement soudain : passé simple."}, {"q": "Autrefois, le château ___ à un comte.", "a": "appartenait", "w": ["appartint"], "why": "Situation qui dure : imparfait."}, {"q": "Il ___ son manteau, prit sa loupe et sortit.", "a": "enfila", "w": ["enfilait"], "why": "Actions successives : passé simple."}, {"q": "« marcher » au passé simple, 3e personne du singulier :", "a": "il marcha", "w": ["il marchat", "il marchait"], "why": "Verbes en -er : il marcha, sans t."}, {"q": "Chaque matin, elle ___ le journal.", "a": "lisait", "w": ["lut"], "why": "Habitude : imparfait."}], "terrain": [{"t": "Soudain, le loup {sortait|sortit} du bois.", "why": "Événement soudain du récit : passé simple."}, {"t": "Il {marchat|marcha} jusqu'à la grille.", "why": "Passé simple des verbes en -er à la 3e personne : -a, sans t."}], "open": false}, {"num": 19, "id": "FUT", "fam": "CONJ", "title": "Futur ou conditionnel", "lv": [5, 4], "affaire": "L'affaire du s de l'incertitude", "q": "« je partirai » ou « je partirais » : que change ce petit s ?", "groups": ["futur (-rai)", "conditionnel (-rais)"], "corpus": [{"t": "Demain, je [partirai] tôt.", "g": 0}, {"t": "Si j'avais le temps, je [partirais].", "g": 1}, {"t": "Je [voudrais] un renseignement.", "g": 1}, {"t": "Quand tu arriveras, je te [dirai] tout.", "g": 0}, {"t": "Il a dit qu'il [viendrait].", "g": 1}, {"t": "L'an prochain, nous [visiterons] Londres.", "g": 0}], "hyps": [{"t": "Le futur annonce un fait à venir présenté comme certain ; le conditionnel exprime un fait soumis à une condition, une demande polie ou un futur vu depuis le passé.", "ok": true, "r": ""}, {"t": "On met le conditionnel quand la phrase contient « si ».", "ok": false, "r": "Contre-exemple : « Je voudrais un renseignement » — pas de « si », et pourtant conditionnel."}, {"t": "Le conditionnel exprime un fait passé.", "ok": false, "r": "Contre-exemple : « Je voudrais un renseignement » : la demande est présente."}], "rule": "Futur : -rai, -ras, -ra, -rons, -rez, -ront (fait à venir, présenté comme certain). Conditionnel présent : -rais, -rais, -rait, -rions, -riez, -raient (fait soumis à une condition, souhait, politesse, information incertaine, futur dans le passé). À la 1re personne du singulier, seul le s les distingue : je partirai / je partirais.", "tool": "changer-personne", "toolUse": "Remplace « je » par « nous » : « nous partirons » (futur) ou « nous partirions » (conditionnel) — la différence s'entend.", "ex": "Si tu viens, je serai content ; si tu venais, je serais content.", "piege": "Après « si » de condition, jamais de futur ni de conditionnel : « Si je pouvais… » (voir le code 23).", "note": null, "defis": [{"q": "Demain, je ___ le coupable. (trouver)", "a": "trouverai", "w": ["trouverais"], "why": "Fait à venir certain : futur."}, {"q": "Je ___ vous poser une question. (aimer)", "a": "aimerais", "w": ["aimerai"], "why": "Politesse : conditionnel."}, {"q": "Il promit qu'il ___ le lendemain. (revenir)", "a": "reviendrait", "w": ["reviendra"], "why": "Futur vu du passé : conditionnel."}, {"q": "Quand nous ___ le code, la porte s'ouvrira. (avoir)", "a": "aurons", "w": ["aurions"], "why": "Fait à venir : futur."}, {"q": "Si j'étais détective, je ___ des enquêtes. (mener)", "a": "mènerais", "w": ["mènerai"], "why": "Condition (si + imparfait) : conditionnel."}, {"q": "L'an prochain, nous ___ en 4e. (être)", "a": "serons", "w": ["serions", "serrons"], "why": "Fait à venir : futur."}], "terrain": [{"t": "Demain matin, je {partirais|partirai} à sept heures, c'est décidé.", "why": "Fait à venir annoncé comme certain : futur (-rai)."}, {"t": "Si j'avais une loupe, je {verrai|verrais} mieux.", "why": "Si + imparfait → conditionnel (-rais)."}], "open": false}, {"num": 20, "id": "PC", "fam": "CONJ", "title": "Temps composés : être ou avoir", "lv": [6, 5, 4], "affaire": "L'affaire des deux auxiliaires", "q": "Pourquoi « elle est partie » mais « elle a parlé » ?", "groups": ["auxiliaire être", "auxiliaire avoir"], "corpus": [{"t": "Elle [est] partie.", "g": 0}, {"t": "Elle [a] parlé.", "g": 1}, {"t": "Nous [sommes] arrivés.", "g": 0}, {"t": "Nous [avons] attendu.", "g": 1}, {"t": "Il [s'est] caché.", "g": 0}, {"t": "Il [a] caché la clé.", "g": 1}], "hyps": [{"t": "On emploie être avec certains verbes de mouvement ou de changement d'état (aller, venir, partir, naître…) et avec tous les verbes pronominaux ; avoir avec les autres.", "ok": true, "r": ""}, {"t": "On emploie être quand le sujet est une personne.", "ok": false, "r": "Contre-exemple : « Elle a parlé » — le sujet est une personne, mais auxiliaire avoir."}, {"t": "Un même verbe prend toujours le même auxiliaire.", "ok": false, "r": "Contre-exemple : « Il s'est caché » / « Il a caché la clé » : cacher change d'auxiliaire quand il est pronominal."}], "rule": "Les temps composés (passé composé, plus-que-parfait, futur antérieur, passé antérieur…) se forment avec un auxiliaire (être ou avoir) conjugué, suivi du participe passé. Être s'emploie avec les verbes pronominaux et une quinzaine de verbes de déplacement ou de changement d'état (aller, venir, arriver, partir, entrer, sortir, monter, descendre, tomber, rester, naître, mourir…) ; avoir avec tous les autres. Passé composé : auxiliaire au présent ; plus-que-parfait : à l'imparfait ; futur antérieur : au futur.", "tool": "changer-temps", "toolUse": "Passe à un autre temps composé : « elle est partie » → « elle était partie » : l'auxiliaire reste le même.", "ex": "Quand il est rentré, ses amis étaient déjà partis.", "piege": "Sortir, monter, descendre, rentrer prennent avoir quand ils ont un COD : « Il a sorti la poubelle ».", "note": null, "defis": [{"q": "Hier, ils ___ venus me voir.", "a": "sont", "w": ["ont"], "why": "Venir : auxiliaire être."}, {"q": "Nous ___ couru jusqu'au port.", "a": "avons", "w": ["sommes"], "why": "Courir : auxiliaire avoir."}, {"q": "Elle ___ sorti son carnet.", "a": "a", "w": ["est"], "why": "Avec un COD (son carnet), sortir prend avoir."}, {"q": "Quand je suis arrivé, il ___ déjà parti.", "a": "était", "w": ["avait"], "why": "Plus-que-parfait de partir : être à l'imparfait."}, {"q": "Les enfants se ___ endormis.", "a": "sont", "w": ["ont"], "why": "Verbe pronominal : être."}, {"q": "Dans une heure, j'___ fini.", "a": "aurai", "w": ["serai"], "why": "Futur antérieur de finir : avoir au futur."}], "terrain": [{"t": "Hier, nous {avons|sommes} allés au musée.", "why": "Aller : auxiliaire être."}, {"t": "Le train {est|a} roulé toute la nuit.", "why": "Rouler : auxiliaire avoir."}], "open": false}, {"num": 21, "id": "SUBJ", "fam": "CONJ", "title": "Le subjonctif", "lv": [4, 3], "affaire": "L'affaire des faits imaginés", "q": "Après « que », pourquoi tantôt « tu viens », tantôt « tu viennes » ?", "groups": ["subjonctif", "indicatif"], "corpus": [{"t": "Il faut que tu [viennes].", "g": 0}, {"t": "Je sais que tu [viens].", "g": 1}, {"t": "Je veux qu'elle [fasse] attention.", "g": 0}, {"t": "Je crois qu'elle [fait] attention.", "g": 1}, {"t": "Bien qu'il [soit] tard, on continue.", "g": 0}, {"t": "Parce qu'il [est] tard, on arrête.", "g": 1}], "hyps": [{"t": "On emploie le subjonctif dès qu'il y a « que ».", "ok": false, "r": "Contre-exemple : « Je sais que tu viens » — il y a « que », mais c'est l'indicatif."}, {"t": "Le subjonctif suit les expressions de volonté, d'obligation, de sentiment ou de doute, et certaines conjonctions (bien que, pour que, avant que) : le fait est envisagé, pas constaté.", "ok": true, "r": ""}, {"t": "Le subjonctif sert à parler du futur.", "ok": false, "r": "Contre-exemple : « Bien qu'il soit tard » — le fait est présent."}], "rule": "Le subjonctif présente un fait envisagé (souhaité, exigé, craint, douteux) plutôt que constaté. On l'emploie après : il faut que, vouloir que, souhaiter que, avoir peur que, douter que, bien que, pour que, avant que, afin que… Terminaisons : -e, -es, -e, -ions, -iez, -ent (que je chante, que nous chantions).
